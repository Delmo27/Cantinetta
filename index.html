<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>La mia cantinetta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>
:root{--bg:#12100f;--card:#1d1917;--card2:#26211e;--line:#3a312c;--txt:#f2ebe3;--mut:#a89b8d;--gold:#c9a96e;--wine:#8e2438;--ok:#4fa84a;--warn:#e8a928;--bad:#d1453b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(#12100f 80%,rgba(18,16,15,0))}
.brand{display:flex;gap:10px;align-items:center;color:var(--gold)}
.brand h1{font-size:19px;color:var(--txt);letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--mut)}
.bell{position:relative;color:var(--gold);padding:8px}
.bell b{position:absolute;top:2px;right:0;background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{padding:4px 16px}
.sec{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:18px}
.sec small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--mut);font-size:14px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1410;font-weight:600}
.lbl{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.bd{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.rec{background:linear-gradient(160deg,#241e1b,#1b1614);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;cursor:pointer}
.rec .t{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.rec h3{font-size:18px;line-height:1.25}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.pin{display:flex;gap:7px;align-items:center;margin-top:11px;color:var(--gold);font-size:14px}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.why span{font-size:12px;color:var(--mut);background:var(--card2);padding:4px 9px;border-radius:9px}
.why span.p{color:#e8d9b5;background:#3a2e1c}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--gold);color:#1a1410;font-weight:700;text-align:center}
.btn.sec2{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:500}
.btn.dng{background:none;color:var(--bad);border:1px solid #5b2a26}
.btns{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px}
.row{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid #2a231f;cursor:pointer}
.row .th{width:42px;height:42px;border-radius:50%;flex:none;background-size:cover;background-position:center;border:2px solid #0004;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.row .m{flex:1;min-width:0}
.row .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .m span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--gold);color:#1a1410;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #000a;z-index:25}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#171311ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--gold)}
/* map */
.cab{background:linear-gradient(#1a1513,#141110);border:2px solid #3b2f27;border-radius:16px;padding:10px 10px 4px}
.shelf{margin-bottom:12px}
.shl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:0 2px 6px}
.shl b{color:var(--gold);font-weight:600}
.sr{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sr .rl{width:38px;flex:none;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#6f6359}
.sg{flex:1;display:grid;gap:5px}
.board{height:6px;border-radius:3px;background:linear-gradient(#6b4a2d,#42301f);margin:3px 0 0 44px}
.slot{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
.slot i{font-style:normal;font-size:10.5px;font-weight:700}
.slot.e{border:1.5px dashed #3d332d}
.slot.b{background:var(--c);border:3px solid var(--r);box-shadow:inset 0 0 0 2px #0003}
.slot.dim{opacity:.18}
.slot.hit{box-shadow:0 0 0 3px #fff,0 0 14px 4px var(--gold);z-index:2}
.slot.mv{outline:3px solid #fff;outline-offset:2px}
.moving .slot.e{border-color:var(--gold);background:#c9a96e22}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:12px 2px;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.legend u{width:12px;height:12px;border-radius:50%;display:inline-block}
.banner{background:#3a2e1c;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.banner button{color:var(--gold);font-weight:700}
/* sheet */
#wrap{position:fixed;inset:0;z-index:50;display:none}
#wrap.open{display:block}
#bk{position:absolute;inset:0;background:#000b}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:#1b1715;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.grab{width:44px;height:5px;background:#4a3f38;border-radius:3px;margin:9px auto 12px}
.hero{height:150px;margin:0 -18px 14px;background-size:cover;background-position:center;position:relative}
.hero.nop{height:68px;margin-top:-12px;border-radius:22px 22px 0 0}
#sheet h2{font-size:23px;line-height:1.2}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0}
.kv div small{display:block;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.win{margin:16px 0 4px}
.track{position:relative;height:10px;border-radius:5px;display:flex;overflow:hidden}
.track i{display:block;height:100%}
.mark{position:absolute;top:-5px;width:3px;height:20px;background:#fff;border-radius:2px;box-shadow:0 0 6px #000}
.wl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;letter-spacing:.4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--mut);line-height:1.5}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi b{font-family:Georgia,serif;font-size:25px;color:var(--gold);display:block}
.kpi small{color:var(--mut);font-size:12px}
.bar{display:grid;grid-template-columns:96px 1fr 46px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px}
.bar .v{text-align:right;color:var(--mut)}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:8px 0}
.stack i{display:block;height:100%}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mut);min-width:0}
.cols i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.cols span{margin-top:4px;white-space:nowrap}
.cols em{font-style:normal;font-size:10px;color:var(--txt);margin-bottom:2px}
.ins{background:#2a2118;border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px;margin:10px 0;line-height:1.45}
.ok{color:var(--ok);font-size:14px;padding:8px 2px}
.menu .row{padding:15px 4px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#e8d9b5;color:#1a1410;padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.clk{cursor:pointer}
.chk{display:flex;gap:10px;align-items:center;margin:9px 0;color:var(--txt);font-size:14px}
.chk input{width:20px;height:20px;flex:none}
.poschip{display:inline-block;min-height:28px;line-height:18px;padding:5px 10px;border:1px dashed var(--gold);border-radius:10px;color:var(--gold);font-size:12px;font-weight:600;background:#c9a96e14}
.poschip:active{opacity:.6}
.fillbar{position:sticky;top:62px;z-index:12;background:var(--bg);padding:4px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.fs{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid transparent;flex:none}
.fs.e{border:1.5px dashed #5a4a3d;color:#6f6359}
.fs.t{border:2px solid var(--gold);color:var(--gold);box-shadow:0 0 10px #c9a96e66;background:#c9a96e18}
.fs.b{border-color:#0005}
.fsl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut)}
.stpb{width:46px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;line-height:1;color:var(--gold)}
.stpb:active{opacity:.6}
details.gd{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.gd summary{padding:14px;font-family:Georgia,"Times New Roman",serif;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.gd summary::-webkit-details-marker{display:none}
details.gd summary:after{content:"+";color:var(--gold);font-size:22px;font-family:-apple-system,"Segoe UI",sans-serif}
details.gd[open] summary:after{content:"\2212"}
.gdb{padding:0 14px 14px;color:var(--txt);line-height:1.6;font-size:14px}
.gdb p{margin:8px 0}
.gdb ul,.gdb ol{margin:6px 0;padding-left:20px}
.gdb li{margin:5px 0}
.gdb .k{display:inline-block;padding:1px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--gold);font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;flex:none;box-sizing:border-box}
.bar.clk:active,.cols div.clk:active,.kpi.clk:active,.legend span.clk:active{opacity:.55}
.legend span.clk{padding:4px 0}
a.btn{text-decoration:none}
details.rsd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 14px}
details.rsd summary{cursor:pointer;color:var(--gold);font-weight:600}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
#login .box{width:100%;max-width:380px}
.ev{display:grid;grid-template-columns:72px 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid #2a231f;font-size:13px}
.ev span{color:var(--mut);grid-row:span 2}
.ev b{font-weight:600}
.ev i{font-style:normal;color:var(--mut)}
.err{color:var(--bad);font-size:14px;margin:10px 0;min-height:20px;line-height:1.4}
</style>
</head>
<body>
<div id="app"><header id="hdr"></header><main id="view"></main></div>
<button class="fab" data-act="add" aria-label="Aggiungi bottiglia"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav><div id="nav"></div></nav>
<div id="wrap"><div id="bk" data-act="closeSheet"></div><div id="sheet"></div></div>
<div id="toast"></div>
<div id="login"></div>
<input type="file" id="fileImp" accept="application/json,.json" hidden>
<input type="file" id="fileFoto" accept="image/*" hidden>

<script>
/* ============ DATI INIZIALI ============ */
const APP_VERSION = '9';
const RELEASES = [
  { v: 9, d: '2026-11-16', t: 'Backup sicuro, controllo inventario, cosa ricomprare e dati da completare', i: [
    "Promemoria del backup: se l'ultimo ha più di 30 giorni (o non c'è) compare un avviso in Stasera e negli Avvisi, con +1 sulla campana. Si può rimandare di 7 giorni.",
    'Il backup ora comprende anche la storia delle bottiglie e, dal telefono, si salva o si condivide direttamente (per esempio in OneDrive). Importando un backup la storia viene ripristinata.',
    "Nuovo Altro › Controllo inventario: confronti ripiano per ripiano l'app con la cantinetta vera, confermi le file giuste e correggi al volo ciò che non torna.",
    'Nuovo Altro › Cosa ricomprare (e collegamento in Statistiche): dai tuoi voti ricava i vini da ricomprare, quelli da evitare e le medie per produttore, regione, tipo e vitigno.',
    'Nuovo Altro › Completa i dati mancanti, senza obblighi: annate, finestre, sboccature, prezzi e voti, una bottiglia alla volta, con «Salta per ora» e «Nessuna informazione».',
    'Le bottiglie segnate «nessuna informazione» non sono più segnalate come mancanti negli avvisi e sulla campana. Si può impostare anche dal form di modifica, in «Dati non disponibili».',
    'Il form di una bottiglia bevuta, regalata o persa mostra ora anche stato, data e voto, per completare le bevute importate dall\'Excel.',
    "Guida e documento per l'assistente aggiornati."] },
  { v: 8, d: '2026-11-16', t: 'Note di rilascio', i: [
    'Nuova sezione Altro › Novità e versioni con lo storico di tutto quello che è stato aggiunto o cambiato, versione per versione.',
    "In Altro, in fondo, vedi il numero di versione: dopo un aggiornamento serve a controllare che sia arrivato davvero.",
    "Dopo ogni aggiornamento compare un avviso in Stasera con il titolo delle novità, da chiudere con la ✕.",
    "Il Documento per l'assistente contiene ora la versione corrente, la regola di aggiornare note di rilascio e documento a ogni modifica e la storia delle versioni, generata da queste note.",
    'Il documento elenca anche i punti aperti e le idee di miglioramento proposte.'] },
  { v: 7, d: '2026-11-16', t: 'Ricerca guidata senza JSON e documento per l\'assistente', i: [
    "La ricerca guidata della finestra di consumo non usa più il JSON: l'assistente chiude la risposta con una riga «FINESTRA: AAAA-AAAA» e gli anni si scrivono a mano oppure si leggono dall'app.",
    'Nel form, sotto gli anni, compare lo stato di maturità di oggi e il calendario dei passaggi (Pronto, Al meglio, Da bere presto, Oltre finestra).',
    "Nuovo Altro › Documento per l'assistente: tutta la logica dell'app in un testo da copiare o scaricare, per rifarla o modificarla in futuro senza spiegare nulla da capo.",
    'Guida aggiornata con il calcolo dello stato di maturità. Massimo 12 posti per fila anche nell\'editor dei ripiani.'] },
  { v: 6, d: '2026-11-16', t: 'Posizione dall\'elenco e svuota e riempi', i: [
    'In Cerca ogni bottiglia ha un codice dorato: toccandolo si cambia la posizione dall\'elenco, senza toglierla e riaggiungerla. Posto occupato: le due bottiglie si scambiano.',
    'Filtro «Senza posto» e ordinamento per posizione con intestazioni per ripiano, livello e fila.',
    'Altro › Svuota e riempi la cantinetta, per le pulizie: svuota tutto, poi rimetti le bottiglie nell\'ordine in cui le riponi. Disposizione automatica facoltativa e annulla dell\'ultima operazione.',
    'Corretto un errore: in Cerca, Stasera e Storico solo la prima riga di ogni elenco si apriva.'] },
  { v: 5, d: '2026-11-16', t: 'Capienza variabile, riordino e Guida', i: [
    'I posti di ogni fila si regolano con − e + sotto la mappa, e dal form di una nuova bottiglia si può aggiungere un posto a una fila piena.',
    'Riordino: dopo aver tolto una bottiglia bloccata, l\'app chiede dove hai rimesso quelle spostate e aggiorna i codici.',
    "Nuova Guida all'app con legenda della mappa, lettura dei codici, uso e domande frequenti.",
    'Il messaggio di conferma ora compare in alto e non copre più i pulsanti.'] },
  { v: 4, d: '2026-11-16', t: 'Livelli, codici univoci e statistiche cliccabili', i: [
    'Ripiani su due livelli (basso e alto) e codice univoco per ogni bottiglia, per esempio 4A-P3: ripiano, livello, fila e numero. Conversione automatica delle posizioni precedenti.',
    'Avviso nella scheda quando una bottiglia è bloccata da altre.',
    'Statistiche cliccabili: toccando una barra, una colonna o un numero si apre l\'elenco delle bottiglie, che si può evidenziare nella mappa.',
    'Prima versione della ricerca guidata della finestra di consumo.'] },
  { v: 3, d: '2026-11-16', t: 'Mappa evoluta e 3D', i: [
    'Bottiglie disegnate sdraiate, testa contro testa e sfalsate, con le file P (fondo verso lo sportello) e R (fondo verso il retro).',
    'Vista Dall\'alto, un ripiano alla volta, e vista 3D che si ruota con il dito.',
    'Ricerca che evidenzia le bottiglie nella mappa e colori per tipo, maturità, paese o prezzo.'] },
  { v: 2, d: '2026-11-16', t: 'Versione online', i: [
    'Accesso con email e password e dati in un database sincronizzato tra i dispositivi, con funzionamento anche senza rete.',
    'Storia di ogni bottiglia: acquisto, collocazione, spostamenti e consumo.',
    'Foto dell\'etichetta, backup, importazione dei dati iniziali e installazione sulla schermata Home.'] },
  { v: 1, d: '2026-11-16', t: 'Prototipo', i: [
    'Prima versione con i 60 vini importati dall\'Excel: Stasera con proposte e abbinamenti, Cerca, Mappa, Statistiche e Avvisi.',

regole, mappa del codice, punti aperti, decisioni); se aggiungi un segnaposto, ricordati di sostituirlo in `specText`;\n  3. aggiorna la **Guida** (`viewGuida`) se cambia il modo di usare l'app;\n  4. nella risposta all'utente riassumi le novità e dì se hai aggiornato documento e Guida.\n- **Collauda prima di consegnare**, per esempio con un browser headless (Playwright/Chromium) e il finto database descritto nel paragrafo 12. Dì chiaramente cosa non hai potuto provare (tipicamente il Firebase reale).\n- **Non rompere i dati esistenti.** Se cambi il formato dei dati, scrivi una migrazione automatica che gira all'apertura (vedi `convShelves` e `convBottles`) e dillo all'utente, consigliandogli un backup prima dell'aggiornamento.\n- Prima di cambiare qualcosa di strutturale, controlla coerenza e casi limite e segnala ciò che non torna. L'utente apprezza che si segnalino incoerenze e pezzi mancanti.\n\n## 1. Cos'è l'app\n\nUna web app personale (usata al 99% da telefono) per gestire la cantinetta dei vini di casa, dall'acquisto alla stappata: dove si trova ogni bottiglia, quando è il momento giusto per berla, cosa aprire stasera, statistiche, storico. Sostituisce un file Excel (`Cantinetta_v5.xlsx`, circa 60 bottiglie) da cui i dati iniziali sono stati importati.\n\nLo stile è **scuro ed elegante** (fondo quasi nero, oro come colore d'accento, titoli con font serif). Tutto in italiano. I voti vanno da **0 a 10** (passo 0,5). Gli **ID tecnici delle bottiglie non vanno mai mostrati** all'utente: non li riconosce.\n\nLa cantinetta è un modello Haier a doppia temperatura, ma tenuto alla stessa temperatura in entrambe le zone: l'app non gestisce due zone.\n\n## 2. Architettura\n\n- **Un solo file `index.html`** con HTML, CSS e JavaScript \"vanilla\" (nessun framework, nessuna build, nessun `npm`). Circa 1.500 righe. Si modifica sostituendo il file.\n- **Hosting**: GitHub Pages, repository **pubblico**. Contiene solo codice e `config.js`, mai i dati dei vini.\n- **Database e | miniatura 110 px della foto etichetta, come data URL JPEG |\n| `aiWin` | (facoltativo, vecchio) motivazione e fonti salvate dalla ricerca guidata quando produceva JSON |\n| `noInfo` | (facoltativo) oggetto con flag `true` per i dati che l'utente ha dichiarato «nessuna informazione»: `annata`, `finestra`, `sboccatura`, `prezzo`, `voto`. Un dato segnato così non è più considerato mancante (né nel wizard «Completa i dati», né negli Avvisi, né nel numero della campana). Se il dato viene poi inserito, il flag viene tolto |\n\n**`meta/shelves`**: un documento `{ list: [...] }` con la struttura dei ripiani, formato `{ n, lv: [{p, r}, {p, r}] }` (paragrafo 4).\n\n**`meta/app`**: un documento con piccole impostazioni condivise tra i dispositivi, scritto con `setDoc(..., {merge:true})`: `backupLast` (data ISO dell'ultimo backup) e `invLast` (data ISO dell'ultimo controllo inventario completo). Può non esistere.\n\n**`photos/{idBottiglia}`**: `{ full }` con la foto etichetta a 900 px (JPEG qualità ~0,72, data URL). La miniatura sta nel documento della bottiglia per far vedere subito le liste.\n\n**`events/{auto}`**: `{ bottleId, name, type, at (ISO), testo }`. Tipi: `acquistata`, `collocata`, `spostata`, `bevuta`, `regalata`, `persa`, `rimessa`, `eliminata`. Sono scritti dal client confrontando lo stato salvato con quello nuovo (`deriveEvents`). Sono **inclusi nel backup** e ripristinati dall'importazione. Sono **sospesi** durante operazioni in blocco (importazione, svuota, disposizione automatica, migrazione) per non riempire la storia. Le interrogazioni usano solo `where('bottleId','==',id)` senza `orderBy` (per non richiedere indici) e ordinano nel client.\n\n### Sincronizzazione\n`onSnapshot` su `bottles`, su `meta/shelves` e su `meta/app` (quest'ultimo non blocca il primo caricamento; `S.appReady` indica che è arrivato). Il client tiene `synced` (firma JSON di ogni bottiglia già salvata); `save()` confronta lo stato in memoria con le firme e scrive solo le bottiglie cambiate, così non nascono cicli. Se l'utente sta scrivendo in un campo, `renderIfIdle()` evita di ridisegnare la pagina.\n\n### Strutture e formati cambiati nel tempo (migrazioni automatiche all'apertura)\n1. Ripiani: `{n, cap, rows}` → `{n, p, r}` → `{n, lv:[{p,r},…]}` (`convShelves`).\n2. Posizione: `piano` + `posto` (numero progressivo) → `piano` + `liv` + `fila` + `pos` (`convBottles`). Le bottiglie che non trovano posto nella nuova struttura restano in cantina senza posizione, con `posPrec`.\n3. L'importazione di un backup vecchio passa dalle stesse conversioni.\n\n## 4. Geometria e numerazione (parte più importante)\n\nLa cantinetta ha più **ripiani** (il numero 1 è il più alto, l'ultimo è a terra). Le bottiglie sono **sdraiate, testa contro testa, incastrate e sfalsate**: in ogni ripiano ci sono due file affacciate, con i fondi delle bottiglie verso lo sportello (**fila P**, \"porta\") oppure verso il retro (**fila R**). Un ripiano può avere **due livelli** (un secondo strato appoggiato sopra il primo: **B** basso, **A** alto); alcuni ripiani hanno un solo livello o una sola fila.\n\n**Codice di una bottiglia** = `ripiano` + `livello` + `-` + `fila` + `numero`, per esempio **`4A-P3`**: ripiano 4, livello alto, fila con il fondo verso lo sportello, terza da sinistra guardando dallo sportello. Regex: `^(\\d+)([BA])-([PR])(\\d+)$`. Il codice cambia **solo** se la bottiglia viene spostata fisicamente. Dallo sportello, nelle file P si vede il fondo della bottiglia, nelle file R il collo.\n\nDisegno e disposizione sfalsata:\n- Nella vista dall'alto, la R1 sta tra la P1 e la P2: le posizioni R si trovano a metà tra due P (`slotX`). Se in un livello c'è una sola fila, le posizioni partono da mezzo posto.\n- Il livello A è traslato di mezzo posto rispetto a B e appoggiato nelle \"valli\" (nel 3D è sollevato di `LVDY`).\n\n**Capienza variabile**: i posti per fila **non sono fissi**, cambiano da ripiano a ripiano e secondo la bottiglia (per esempio 13 o 16 bottiglie per ripiano). L'utente li regola in ogni momento: contatori − e + sotto la mappa (massimo 12 per fila), oppure Altro › Ripiani, livelli e file. Regole: non si può togliere un posto occupato; il livello basso non può restare vuoto se esiste quello alto; un livello alto vuoto sparisce.\n\n**Bottiglie che ne bloccano altre** (`blockers`): una bottiglia di fila R è bloccata dalle P nelle posizioni `pos` e `pos+1` dello stesso livello; una bottiglia del livello B è bloccata da quelle del livello A (stessa fila) nelle posizioni `pos-1` e `pos`. È un'euristica geometrica. La procedura reale dell'utente: tira fuori la bottiglia dietro, rimette quelle davanti, a volte in posti diversi. Per questo esiste il **Riordino** (paragrafo 8).\n\n**Posto suggerito** (`suggestSlot`) per un nuovo acquisto: ripiani preferiti per tipo (rossi `[1,2,3,4,5]`, bianchi/rosati/dolci `[3,4,2,5,1]`, bollicine `[5,4,3,2,1]`, poi l'ultimo); dentro il ripiano prima il livello B, prima la fila R, in ordine di numero.\n\n### Struttura attuale dei ripiani (al momento della generazione)\n{{STRUTTURA}}\n\n### Stato dei dati (al momento della generazione)\n{{DATI}}\n\n## 5. Stato di maturità (calcolato automaticamente)\n\nDipende solo da `inizio` e `fine` (anni solari) e dall'**anno corrente**, ed è ricalcolato ogni volta che si apre l'app: non va mai inserito a mano. Funzione `mat(b, anno)`:\n- `inizio` o `fine` mancanti → **Finestra mancante**.\n- anno < `inizio` → **Attendere**.\n- anno > `fine` → **Oltre finestra**.\n- altrimenti `p = (anno − inizio) / (fine − inizio)` (se inizio = fine, `p = 1`):\n  - se `fine − anno ≤ 1` oppure `p ≥ 0,75` → **Da bere presto**;\n  - altrimenti se `p ≥ 0,25` → **Al meglio**;\n  - altrimenti → **Pronto**.\n\nEsempio con finestra 2027-2042: 2026 Attendere · 2027 Pronto · 2031 Al meglio · 2039 Da bere presto · 2043 Oltre finestra. Le soglie del 25% e 75% sono una scelta di progetto, non uno standard enologico: si possono cambiare in `mat`.\n\nColori (usati ovunque): Attendere `#bdd7ee`, Pronto `#c9e3b9`, Al meglio `#4fa84a`, Da bere presto `#ffc000`, Oltre finestra `#c0392b`, Finestra mancante `#f1e1a6`. La scheda mostra una barra con i tre tratti (25% Pronto, 50% Al meglio, 25% Da bere presto) e un indicatore sull'anno corrente. Nel form, sotto gli anni, c'è un'anteprima dello stato di oggi e del calendario dei passaggi.\n\n## 6. Le schede dell'app\n\nNavigazione in basso: **Stasera**, **Cerca**, **Mappa**, **Statistiche**, **Altro**. In alto una campana con il numero di avvisi. Il tasto **+** (in basso a destra) aggiunge una bottiglia. Le schede di dettaglio sono \"sheet\" che salgono dal basso.\n\n- **Stasera** (`recommend`): l'utente sceglie occasione (Quotidiana, Cena tra amici, Romantica, Speciale), tipo (Qualsiasi, Rosso, Bianco, Bollicine, Altro) e cosa mangia (12 categorie, `TAGS`). L'app propone 3 bottiglie con posizione e motivi, \"Altre proposte\" fa scorrere. Punteggio: base per maturità (Oltre finestra 100, Da bere presto 80, Al meglio 55, Pronto 35, Finestra mancante 20; Attendere escluso) + urgenza `max(0, 10 − anniRimasti)·2` + abbinamento (+40 se il piatto è tra gli abbinamenti, −30 altrimenti) + occasione (Quotidiana: prezzo ≤ 25 € +30, > 40 € −30; Cena tra amici: 20-60 € +15, > 90 € −15; Romantica: bollicine +20, ≥ 40 € +10; Speciale: ≥ 60 € +40, < 30 € −20) − 6 per ogni bottiglia che la blocca. Sotto: \"Le prossime da bere\".\n- **Cerca**: ricerca libera (senza accenti, tutte le parole devono comparire), filtri per tipo, maturità e \"Senza posto\" (visibile solo se serve), ordinamenti (da bere prima, nome, annata, prezzo, posizione: ordinando per posizione l'elenco si divide per ripiano, livello e fila), «Includi bevute». Ogni riga di una bottiglia in cantina ha un **codice dorato tratteggiato** che apre il cambio di posizione (paragrafo 7).\n- **Mappa**: vista **Dall'alto** (un ripiano e un livello alla volta, SVG con le bottiglie sagomate e sfalsate) e vista **3D** (canvas, tutta la cantinetta con i ripiani sovrapposti: trascinare per ruotare, pizzicare per ingrandire, toccare una bottiglia per aprirla, tre angoli rapidi). Si colora per Tipo, Maturità, Paese o Prezzo; il bordo mostra sempre la maturità (tranne in modalità Maturità); sulla bottiglia le ultime due cifre dell'annata ('22) o NV; una sagoma tratteggiata è un posto libero. Una barra di ricerca evidenzia le bottiglie corrispondenti (le altre diventano opache) e le statistiche possono evidenziare un insieme di bottiglie. Dalla vista dall'alto si sposta una bottiglia (scheda › Sposta › tocca il nuovo posto; se è occupato, scambio).\n- **Statistiche**: KPI (bottiglie, valore al prezzo d'acquisto, prezzo medio, pronte oggi, bevute, voto medio) e grafici per tipo, maturità, anno di fine finestra, paesi e regioni, annate, fasce di prezzo (< 20, 20–39, 40–69, 70+ €), vitigni, produttori ricorrenti, occupazione ripiani, storico. **Tutto è cliccabile**: tocca una barra/colonna/numero e si apre l'elenco delle bottiglie (`statSel`/`openStat`) con totale in euro e il pulsante «Evidenzia nella mappa».\n- **Avvisi** (campana, `alertsData`): Oltre finestra, Da bere presto, in chiusura (Pronto o Al meglio con fine entro 2 anni), in arrivo in finestra (Attendere con inizio entro 1 anno), Senza finestra, Senza posizione valida, Bollicine senza sboccatura. Sono esclusi da «Senza finestra» e «Bollicine senza sboccatura» i dati segnati `noInfo`. In cima, se serve, due riquadri: **Backup** (se scaduto, con pulsante) e **Dati da completare** (con il pulsante per il wizard). Il numero sulla campana è: oltre finestra + da bere presto + senza finestra + senza posizione + 1 se il backup è scaduto e non rimandato. Non ci sono notifiche push (richiederebbero un server): il numero si aggiorna all'apertura e, dove supportato, sull'icona dell'app.\n- **Stasera, in testa**: avviso «App aggiornata alla versione N» e, se serve, avviso di backup scaduto (vedi paragrafo 10).\n- **Altro**: aggiungi bottiglia, storico (bevute/regalate/perse), **Cosa ricomprare**, **Completa i dati mancanti**, ripiani, svuota e riempi, **Controllo inventario**, backup, importa, guida, questo documento, **Novità e versioni** (note di rilascio, `viewNovita`), esci; in fondo il numero di versione. Dopo un aggiornamento, nella scheda Stasera compare un avviso «App aggiornata alla versione N» (chiuso con ✕ o aprendo le Novità; `localStorage` `cantinetta_seenv`). Il numero di versione serve anche a verificare che l'aggiornamento sia arrivato, visto che la cache può ritardarlo.\n- **Scheda bottiglia**: dati, barra della finestra, posizione con codice e avviso di blocco, temperatura di servizio, abbinamenti, note, **Storia** (eventi), foto etichetta; azioni: «L'abbiamo stappata» (stato, data, voto 0-10, note), Sposta, Cambia posizione da elenco, Mostra in mappa, Modifica, Foto, Rimetti in cantina.\n- **Abbinamenti e temperatura** (`pairing`, `serveTemp`): regole su vitigno, denominazione e tipo (euristiche, non una fonte enologica). Temperature: Champagne 8–10 °C, Spumante 6–8, bianchi 8–10 (Borgogna a base Chardonnay 10–12), rosati e dolci 8–10, rossi 14–16 (Pinot nero, Gamay, Schiava) oppure 16–18.\n\n## 7. Cambiare posizione dall'elenco\n(`openPos` / `applyPos` / `posChoices`) Dall'elenco in Cerca o da «Da riposizionare», toccando il codice dorato si sceglie una posizione da una lista raggruppata per ripiano, livello e fila (ogni voce dice se è libera o chi la occupa). **È sempre la stessa bottiglia, con la sua storia**: non si elimina e non si riaggiunge. Posto occupato: scambio tra le due bottiglie (se la bottiglia non aveva posto, l'altra finisce tra le senza posto, con conferma). C'è anche «+ aggiungi un posto in fondo» per estendere una fila piena. «Nessuna» toglie la posizione.\n\n## 8. Svuota e riempi, Riordino\n- **Svuota e riempi** (Altro › Svuota e riempi la cantinetta): serve per le pulizie periodiche. «Svuota» toglie la posizione a tutte le bottiglie (restano in cantina, `posPrec` memorizzato). Si rimettono scegliendo \"dove sto riponendo\" (ripiano, livello, fila) e toccando le bottiglie **nell'ordine in cui le si ripone**: ognuna va nel prossimo posto libero; a fila piena si passa alla successiva; si può partire da un posto vuoto scelto e correggere i posti con + e −. «Proponi una disposizione automatica» ordina per longevità (fine finestra decrescente) e usa `suggestSlot` (ripiano per tipo, longeve in fondo e in basso). «Annulla ultima operazione» ha una pila in memoria (fino a 30 passi, persa alla chiusura dell'app). Consiglio sempre un backup prima.\n- **Riordino** (`openReorder`): dopo aver stappato una bottiglia bloccata, o dalla scheda («Le ho spostate: riordina»), l'app chiede dove sono state rimesse le bottiglie spostate. Controlla che due non finiscano nello stesso posto o in uno occupato.\n\n## 9. Finestra di consumo e «ricerca guidata»\n\nGli anni `inizio` e `fine` si inseriscono nel form (a mano). Se l'utente non li conosce usa la **ricerca guidata**, senza JSON e senza chiavi API:\n1. Nel form apre «Non conosci la finestra?» e tocca **Copia richiesta**: l'app costruisce un testo con i dati della bottiglia (produttore, vino, annata, tipo, denominazione, regione, vitigni, sboccatura) e le istruzioni per cercare scheda del produttore, critici (Vinous, Wine Advocate, Decanter, Wine Spectator, James Suckling, Jancis Robinson, Gambero Rosso, Doctor Wine, Bibenda), CellarTracker e potenziale della denominazione, senza inventare fonti.\n2. Incolla il testo in un assistente con ricerca web (Copilot con **account personale**, Gemini o ChatGPT, meglio con ricerca approfondita).\n3. L'assistente risponde con una breve motivazione, i punteggi, i link e la confidenza, e chiude con una riga **`FINESTRA: AAAA-AAAA`**.\n4. L'utente scrive i due anni nei campi, oppure incolla la risposta nell'app che legge quella riga e propone «Usa questi anni». Lo stato di maturità si calcola da solo (paragrafo 5).\n5. Per più bottiglie insieme: pulsante in **Avvisi**, per le bottiglie senza finestra (fino a 8 alla volta). Le righe sono numerate («2. FINESTRA: 2027-2038») e l'app mostra un'anteprima con checkbox prima di applicare.\nÈ un suggerimento, la qualità dipende da quello che trova l'assistente: l'utente deve guardare le fonti, soprattutto con confidenza bassa.\n\n## 10. Altre funzioni\n\n- **Foto etichetta**: dalla scheda o dal form; ridotta lato client e salvata in `photos` (full) e `thumb` (miniatura). Il riconoscimento automatico dell'etichetta **non** c'è (servirebbe un servizio esterno gratuito con chiave API).\n- **Backup e promemoria** (Altro › Salva backup, `openBackup`): l'app prepara in memoria un `.json` (formato `v: 3`) con `bottles`, `shelves`, `photos` **ed `events`** (la storia). Poi l'utente sceglie: su telefono «Salva o condividi…» (Web Share API con file, `bkShare`: permette di mandarlo direttamente a OneDrive o File; va chiamata subito dopo il tocco, per questo la preparazione dei dati è un passo separato) oppure «Scarica il file» (link `download`, `bkDownload`, unica via su PC o se la condivisione non è disponibile). Dopo il salvataggio la data va in `meta/app.backupLast` (e in `localStorage` `cantinetta_lastBackup`, vale la più recente). **Promemoria**: se l'ultimo backup ha più di 30 giorni (`BK_DAYS`) o non esiste, compaiono un avviso in Stasera (con «Salva» e «Dopo», che lo rimanda di 7 giorni: `localStorage` `cantinetta_bksnooze`), un riquadro negli Avvisi e +1 sul numero della campana (non se rimandato). **Importa** (`doImport`) sostituisce bottiglie e ripiani (con conferma) e ripristina la storia del file aggiungendo solo gli eventi che non ci sono già (chiave: bottleId + at + type + testo); accetta anche i backup vecchi (v2, senza storia) e converte i formati vecchi. L'importazione serve per l'avvio dall'Excel e per i ripristini.\n- **Controllo inventario** (Altro › Controllo inventario, `viewInventario`): verifica, davanti alla cantinetta, che le posizioni dell'app coincidano con la realtà, un ripiano alla volta, senza svuotare nulla. Per ogni fila (livello + fila) elenca i posti con la bottiglia che dovrebbe esserci. Se la fila è giusta si tocca «Fila corretta» (le file verificate sono in `localStorage` `cantinetta_inv`, così si può riprendere; c'è anche «Tutto il ripiano è corretto»). Se qualcosa non torna si tocca il posto: «Qui c'è un'altra bottiglia» (scelta da un elenco con ricerca, `openInvPick`/`invAssign`: se la bottiglia scelta era altrove le due si scambiano, se non aveva posto l'occupante precedente va tra le senza posto, con conferma), «Non c'è più qui» (togli il posto / è stata bevuta, regalata o persa / è in un altro posto), «Bottiglia non presente nell'app» su un posto vuoto (apre il form con il posto già scelto). Completati tutti i ripiani, la data va in `meta/app.invLast` e le file verificate si azzerano. Le correzioni sono spostamenti normali e finiscono nella storia. Non c'è un promemoria per il controllo.\n- **Cosa ricomprare** (Altro › Cosa ricomprare, e link in Statistiche, `viewRicompra`): usa solo i voti (0-10) delle bottiglie **Bevute**. Un «vino» è la coppia produttore + nome (senza accenti né maiuscole, `wineKey`), tutte le annate insieme. **Da ricomprare**: voto medio ≥ 8 (`REBUY_HI`), con l'indicazione «finita» (nessuna bottiglia dello stesso vino in cantina) o «ne hai ancora N». **Da evitare**: media ≤ 5 (`REBUY_LO`). **Medie** per produttore, regione, tipo e vitigno (un uvaggio conta per ogni vitigno): solo gruppi con almeno 2 bevute e solo se le bottiglie con voto sono almeno 5 (`REBUY_MIN`). Ogni riga è cliccabile e mostra le bottiglie. In alto compare il numero di bevute senza voto, con il collegamento a «Completa i dati».\n- **Completa i dati mancanti** (Altro › Completa i dati, o dagli Avvisi; `viewCompleta`, categorie in `CMP`): procedura guidata **non bloccante**: non compare mai da sola e nulla dipende da essa. Categorie: annata (in cantina senza annata), finestra (senza anni), sboccatura (bollicine), prezzo, voto (bevute senza voto). Mostra una bottiglia alla volta, con il campo da compilare e tre scelte: «Salva e avanti», «Nessuna informazione» (salva il flag in `noInfo`: il dato non esiste o non è noto e non viene più chiesto; per l'annata il testo è «Nessuna annata (NV)») e «Salta per ora» (vale solo per la sessione). Per la finestra c'è l'anteprima dello stato di maturità e la ricerca guidata (copia richiesta + lettura della riga FINESTRA). Gli stessi flag si impostano dal form di modifica, nella sezione «Dati non disponibili». Una bottiglia con finestra segnata «nessuna informazione» resta con lo stato «Finestra mancante» ma esce dagli avvisi.\n- **Modifica di una bottiglia bevuta, regalata o persa**: il form mostra anche stato, data di consumo e voto (0-10, un decimale), per completare le bevute importate dall'Excel.\n- **Guida** (Altro › Guida all'app): sezioni apribili con uso, legenda della mappa, codici, bottiglie bloccate, capienza, svuota e riempi, finestra e calcolo della maturità, backup, problemi frequenti. Va tenuta allineata a ogni modifica.\n- **Documento per l'assistente**: questo testo, generato dall'app (`specText`) con versione, struttura dei ripiani, conteggi e storia delle versioni aggiornati; si copia o si scarica come `.md`. Il testo base è la costante `SPEC_MD` nel codice.\n- **Note di rilascio**: elenco `RELEASES` (più recente per prima) con `v`, `d` (data ISO), `t` (titolo) e `i` (punti, testo semplice). Ogni aggiornamento ne aggiunge una (vedi regole nel paragrafo 0).\n\n## 11. Mappa del codice (`index.html`, ordine approssimativo)\n\n1. `<style>`: variabili colore `--bg --card --gold …`, componenti (`.card .chip .btn .row .bd`, sheet, mappa, statistiche, guida).\n2. Dati iniziali di ripiani (`SEED_SHELVES`), utilità (`esc`, `norm`, `eur`, `todayISO`), icone SVG (`ICON`/`ic`), colori (`MAT`, `TIPO_COL`, `PAESE_COL`, `PREZZO_B`).\n3. Sincronizzazione Firebase: `makeFirebase` (oggetto `Cloud` con le funzioni sul database, tra cui `allEvents` e `setApp`), `startCloud`, `save`, `deriveEvents`/`logEv`, login (`showLogin`, `doLogin`).\n4. Logica del vino: `mat`, geometria (`capOf`, `slotsOf`, `keyOf`, `parseKey`, `validSlot`, `occupancy`, `unplaced`, `freeSlots`, `suggestSlot`, `blockers`), migrazioni (`convShelves`, `convBottles`).\n5. Abbinamenti (`pairing`, `serveTemp`), stato UI (`UI`), `recommend`.\n6. Viste: `viewStasera`, `viewCerca` e `renderRes`, `viewMappa` con `renderCab` (SVG), `draw3D`/`drawBottle3`/`bind3D`/`tap3D` (canvas 3D scritto a mano), `viewStats`/`statSel`/`openStat`, `alertsData`/`viewAvvisi`, `viewAltro`, `viewGuida`, `viewRiordino`, `viewSpec`, `viewNovita` (con `RELEASES`, `APP_VERSION`, `relText`, `relBanner`), `viewInventario`, `viewRicompra`, `viewCompleta`, `backupBanner`.\n7. Scheda bottiglia (`openBottle`), stappata (`openDrink`/`confirmDrink`), `rimetti`, riordino (`openReorder`/`applyReorder`), cambio posizione (`openPos`/`applyPos`), svuota e riempi (`clearAll`, `autoFill`, `placeBottle`, `undoLast`).\n8. Form (`openForm`, `saveForm`, `posOptions`), ricerca guidata (`researchPrompt`, `parseWindows`, …), ripiani (`openShelves`, `adjustCap`), backup (`openBackup`, `bkShare`, `bkDownload`, `doImport`, `bkDue`), controllo inventario (`invRows`, `invAfterMark`, `openInvSlot`, `openInvPick`, `invAssign`), cosa ricomprare (`rebuyData`, `wineKey`), dati mancanti (`CMP`, `cmpList`, `cmpSave`, `noi`).\n9. Tabella delle azioni `ACT` (ogni elemento HTML con `data-act=\"nome\"` chiama `ACT.nome`), `render`, `bindEvents`, `init`.\n\nConvenzioni: l'HTML è costruito con template string; i dati utente passano sempre da `esc()`; i click sono gestiti da un solo listener globale che legge `data-act`; il re-render completo è la regola (`render()`).\n\n## 12. Come si prova senza il database vero\n\nIl codice usa `window.__CLOUD__` se è definito prima del caricamento, al posto di Firebase. Un finto database per i test deve fornire: `onAuth(cb)`, `login(email, password)`, `logout()`, `subscribe({onBottles, onShelves, onApp, onError})` (restituisce una funzione di disiscrizione; deve chiamare `onApp` con l'oggetto di `meta/app`, anche vuoto), `setBottle(b)`, `delBottle(id)`, `setShelves(list)`, `setApp(obj)` (unisce `obj` in `meta/app`), `addEvent(e)`, `getEvents(id)`, `allEvents()`, `getPhoto(id)`, `setPhoto(id, full)`, `delPhoto(id)`, `allPhotos()`. Con Playwright e Chromium headless a 390×844 px si verificano flussi (acquisto, stappata, spostamento, importazione di dati vecchi per le migrazioni), errori di console e screenshot. Quando `window.__CLOUD__` è presente il service worker non si registra.\n\n## 13. Procedura di aggiornamento (da dare all'utente)\n\n1. Scaricare il nuovo `index.html` (o lo ZIP) e, se è un `.txt`, rinominarlo in `index.html` (attivando le estensioni dei file in Windows).\n2. Su GitHub aprire il repository `cantinetta` › **Add file › Upload files**, trascinare **solo** `index.html` (non lo ZIP, non `config.js`), **Commit changes**.\n3. Attendere un paio di minuti, chiudere del tutto l'app e riaprirla.\n4. Se la modifica cambia il formato dei dati: prima **Altro › Salva backup**.\n\n## 14. Decisioni di progetto e preferenze dell'utente\n\n- **Completare i dati non deve mai bloccare**: si segnala, non si obbliga; ogni dato può essere dichiarato «nessuna informazione» (alcune bottiglie non hanno l'annata o altre informazioni).\n- **Backup**: promemoria dopo 30 giorni; il file deve contenere anche la storia; l'utente lo conserva nel suo OneDrive personale.\n- Una riga per bottiglia (non per vino): compra raramente più esemplari dello stesso vino, non gli serve annotare dove li compra, né gli stati «ordinata» o «lista desideri».\n- App per un solo utente oggi; l'eventuale secondo utente (coniuge) si aggiunge dopo.\n- Interessano: foto dell'etichetta, avvisi, abbinamenti, una pagina di statistiche cliccabili, una mappa evoluta (3D) fedele alla realtà.\n- Le risposte devono essere precise, focalizzate sulla richiesta, senza allargare il perimetro e senza proposte non richieste.\n- Il testo dell'interfaccia è breve; le liste sono scorrevoli; l'uso principale è con una mano sola in piedi davanti alla cantinetta.\n\n## 15. Storia delle versioni\n\nGenerata dalle note di rilascio dell'app (`RELEASES`), dalla più vecchia alla più recente.\n\n{{RELEASES}}\n\n## 16. Punti aperti e idee non realizzate\n\n- **Capienze reali**: l'utente deve ancora regolare con − e + i posti reali di ogni fila.\n- **Disposizione automatica**: è una proposta; da confrontare con come l'utente ripone davvero.\n- **Riconoscimento dell'etichetta dalla foto**: non fatto (servizio esterno e chiave API gratuiti da valutare).\n- **Notifiche push sul telefono**: non fatte (servono un server o Firebase Cloud Messaging, con più configurazione).\n- **Secondo utente**: non attivo.\n- Dati storici di partenza: alcune bollicine senza sboccatura e vecchie bevute senza voto o data: l'app segnala le prime tra gli avvisi.\n- **Da collaudare su telefono vero**: la condivisione del file di backup («Salva o condividi…») è stata provata solo con una simulazione; se non funziona, resta «Scarica il file». Anche la connessione a Firebase reale non è mai stata provata dall'assistente.\n- **Cosa ricomprare**: servono più bevute con voto per essere davvero utile (le bevute importate dall'Excel non hanno il voto: si aggiungono da «Completa i dati»).\n- Idee non ancora proposte o scelte: promemoria periodico del controllo inventario; esportazione delle statistiche; un secondo utente.\n";

async function makeFirebase() {

  try { [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]); }
  catch (e) { throw new Error('Impossibile caricare Firebase: controlla la connessione e riprova.'); }
  const app = A.initializeApp(cfg), auth = Au.getAuth(app);
  const db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const col = n => F.collection(db, n);

    onAuth: cb => Au.onAuthStateChanged(auth, cb),

    logout: () => Au.signOut(auth),
    subscribe(h) {
      const u1 = F.onSnapshot(col('bottles'), { includeMetadataChanges: true }, s => h.onBottles(s.docs.map(d => d.data()), { pending: s.metadata.hasPendingWrites, cache: s.metadata.fromCache }), e => h.onError(e));
      const u2 = F.onSnapshot(F.doc(db, 'meta', 'shelves'), s => h.onShelves(s.exists() ? s.data().list : null), e => h.onError(e));
      const u3 = F.onSnapshot(F.doc(db, 'meta', 'app'), s => h.onApp && h.onApp(s.exists() ? s.data() : {}), e => h.onError(e));
      return () => { u1(); u2(); u3(); };
    },
    setBottle: b => F.setDoc(F.doc(db, 'bottles', b.id), b),
    delBottle: id => F.deleteDoc(F.doc(db, 'bottles', id)),
    setShelves: list => F.setDoc(F.doc(db, 'meta', 'shelves'), { list }),
    setApp: obj => F.setDoc(F.doc(db, 'meta', 'app'), obj, { merge: true }),

function recommend() {
  const out = [];
  inC().forEach(b => {
    const m = mat(b); const base = { 'Oltre finestra':100, 'Da bere presto':80, 'Al meglio':55, 'Pronto':35, 'Finestra mancante':20 }[m];
    if (base === undefined) return;
    if (UI.pTipo === 'Rosso' && b.tipo !== 'Rosso') return;
    if (UI.pTipo === 'Bianco' && b.tipo !== 'Bianco') return;
    if (UI.pTipo === 'Bollicine' && !isBolle(b.tipo)) return;
    if (UI.pTipo === 'Altro' && (b.tipo === 'Rosso' || b.tipo === 'Bianco' || isBolle(b.tipo))) return;
    let s = base, why = [];
    const left = b.fine ? b.fine - YEAR : 10;
    if (m === 'Oltre finestra') why.push('Finestra superata: da bere ora');
    else if (m === 'Da bere presto') why.push('Chiude nel ' + b.fine);
    else if (m === 'Al meglio') why.push('Nel momento migliore (' + b.inizio + '–' + b.fine + ')');
    else if (m === 'Pronto') why.push('Già pronto, finestra fino al ' + b.fine);
    s += Math.max(0, 10 - left) * 2;
    const tags = pairing(b);
    if (UI.dish !== 'Nessuno') { if (tags.includes(UI.dish)) { s += 40; why.push('Va con: ' + UI.dish.toLowerCase()); } else s -= 30; }
    const pr = b.prezzo || 0;
    if (UI.occ === 'Quotidiana') { if (pr <= 25) { s += 30; why.push('Prezzo da tutti i giorni'); } else if (pr > 40) s -= 30; }
    if (UI.occ === 'Cena tra amici') { if (pr >= 20 && pr <= 60) s += 15; if (pr > 90) s -= 15; }
    if (UI.occ === 'Romantica') { if (isBolle(b.tipo)) { s += 20; why.push('Bollicine: festa a due'); } if (pr >= 40) s += 10; }
    if (UI.occ === 'Speciale') { if (pr >= 60) { s += 40; why.push('Bottiglia importante'); } else if (pr < 30) s -= 20; if (m === 'Attendere') return; }

}
function countBy(arr, fn) { const m = {}; arr.forEach(x => { const k = fn(x); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); }

}

  else if (k === 'tipo') { t = v; l = sortC(c.filter(b => b.tipo === v)); }
  else if (k === 'mat') { t = v; l = sortC(c.filter(b => mat(b) === v)); }

}
function openInvGone(id, k) {

  openSheet(`<h2>${esc(title(b))} non c'è in ${k}</h2><div style="display:grid;gap:10px;margin-top:14px"><button class="btn" data-act="invunplace" data-id="${id}">Togli il posto: resta in cantina, da collocare</button><button class="btn sec2" data-act="drink" data-id="${id}">L'abbiamo bevuta, regalata o persa</button><button class="btn sec2" data-act="editpos" data-id="${id}">È in un altro posto: cambia posizione</button><button class="btn sec2" data-act="closeSheet">Annulla</button></div>`);

function openInvPick(k) {
  INV.key = k; INV.pq = '';
  openSheet(`<h2>Quale bottiglia c'è in ${k}?</h2><input data-bind="ipq" placeholder="Cerca per nome, produttore, annata…" autocomplete="off" style="margin-top:10px"><div id="iplist" style="margin-top:10px"></div>`);

}
function renderPickList() {
  const el = $('#iplist'); if (!el) return;
  const { occ } = occupancy(), cur = occ[INV.key]; let l = inC().filter(b => !cur || b.id !== cur.id);
  if (INV.pq.trim()) l = l.filter(b => matches(b, INV.pq));
  l.sort((a, b) => (validSlot(a) ? 1 : 0) - (validSlot(b) ? 1 : 0) || title(a).localeCompare(title(b)));
  el.innerHTML = l.length ? `<div class="card" style="padding:4px 12px">${l.slice(0, 40).map(b => rowHtml(b, 'invassign')).join('')}</div>${l.length > 40 ? '<div class="note" style="margin-top:6px">Mostro le prime 40: restringi la ricerca.</div>' : ''}` : '<div class="empty">Nessuna bottiglia</div>';
}
function invAssign(id) {
  const c = getB(id), k = INV.key, sl = parseKey(k); if (!c || !sl) return;
  const { occ } = occupancy(), o = occ[k];
  if (o && o.id === c.id) { closeSheet(); return; }
  const had = validSlot(c) ? snapPos(c) : null;
  if (o) {
    if (had) { Object.assign(o, had); delete o.posto; }
    else { if (!confirm(title(o) + ' era segnata in ' + k + ' e finirebbe tra le bottiglie da collocare. Procedere?')) return; o.posPrec = keyOf(o); clearPos(o); }
  }
  Object.assign(c, sl); delete c.posto; INV.fixes++; save(); closeSheet(); toast(title(c) + ' → ' + k); keepScroll(render);
}

function guideMap() {
  const bp = (x, y, dir, fill, hl) => `<path d="${bottlePath(x, y, dir)}" fill="${fill}" stroke="${hl ? '#fff' : '#d9c9a3'}" stroke-width="${hl ? .12 : .06}"/>`;
  let o = `<svg viewBox="-0.3 -1.4 3.6 ${(DEP + 2.9).toFixed(1)}" style="width:100%;max-width:170px;display:block;margin:10px auto" font-family="inherit">`;
  o += `<rect x="-0.2" y="-0.05" width="3.4" height="${DEP + 0.1}" rx=".2" fill="#241c17" stroke="#4a3b30" stroke-width=".06"/>`;
  [1, 2].forEach(n => { o += bp(n, 0, 1, '#6d2d3a') + `<text x="${n}" y="-0.3" font-size=".36" fill="#a89b8d" text-anchor="middle">R${n}</text>`; });
  [0.5, 1.5, 2.5].forEach((x, i) => { o += bp(x, DEP, -1, '#9b2335', i === 2) + `<text x="${x}" y="${DEP + 0.72}" font-size=".36" fill="${i === 2 ? '#c9a96e' : '#a89b8d'}" font-weight="${i === 2 ? 700 : 400}" text-anchor="middle">P${i + 1}</text>`; });
  return o + `<text x="1.5" y="-0.95" font-size=".4" fill="#6f6359" text-anchor="middle" letter-spacing=".12">RETRO</text><text x="1.5" y="${DEP + 1.35}" font-size=".4" fill="#c9a96e" text-anchor="middle" letter-spacing=".12">SPORTELLO</text></svg>`;
}

function adjustCap(n, liv, f, d) {

}

  cmpno: el => { const b = getB(el.dataset.id); if (!b) return; b.noInfo = Object.assign({}, b.noInfo, { [UI.cmpCat]: true }); save(); toast('Segnato: nessuna informazione'); keepScroll(render); },
  cmpsave: el => cmpSave(el.dataset.id),
  cmpcopy: async el => { const b = getB(el.dataset.id); if (!b) return; const ok = await copyText(researchPrompt([b])); toast(ok ? "Richiesta copiata: incollala nell'assistente" : 'Copia non riuscita'); },
  cmpread: () => { const fr = $('#cmpf'), r = parseWindows(($('#cmprtxt') || {}).value || ''); if (!r.length) { toast('Non trovo la riga FINESTRA: scrivi gli anni a mano'); return; } const w = r[r.length - 1]; fr.elements['inizio'].value = w.inizio; fr.elements['fine'].value = w.fine; $('#cmpprev').innerHTML = matPrevHtml(w.inizio, w.fine); toast('Anni inseriti: controlla e salva'); },
  inventario: () => { UI.tab = 'inventario'; UI.invShelf = null; closeSheet(); render(); window.scrollTo(0, 0); },
  invhome: () => { UI.invShelf = null; render(); window.scrollTo(0, 0); },
  invshelf: el => { UI.invShelf = +el.dataset.v; render(); window.scrollTo(0, 0); },
  invreset: () => { if (confirm('Azzerare le file già verificate e ricominciare?')) { INV.rows = {}; INV.fixes = 0; invSave(); render(); } },
  invrow: el => { invRows()[el.dataset.r] = todayISO(); invSave(); const n = UI.invShelf; invAfterMark(n); render(); if (UI.invShelf !== n) window.scrollTo(0, 0); },
  invreopen: el => { delete invRows()[el.dataset.r]; invSave(); keepScroll(render); },
  invall: el => { const n = +el.dataset.v; invShelfRows(n).forEach(r => { invRows()[rowId(r)] = todayISO(); }); invSave(); invAfterMark(n); render(); window.scrollTo(0, 0); },
  invslot: el => openInvSlot(el.dataset.k),
  invpick: el => openInvPick(el.dataset.k),
  invassign: el => invAssign(el.dataset.id),
  invgone: el => openInvGone(el.dataset.id, el.dataset.k),
  invunplace: el => { const b = getB(el.dataset.id); if (!b) return; if (validSlot(b)) b.posPrec = keyOf(b); clearPos(b); INV.fixes++; save(); closeSheet(); toast('Posto tolto: ' + title(b) + ' è da collocare'); keepScroll(render); },
  invadd: el => { const sl = parseKey(el.dataset.k); if (sl) openForm(null, sl); },
   info: () => ACT.guida(),
  import: () => $('#fileImp').click(),
  logout: () => { if (confirm('Uscire dall\'account?')) { closeSheet(); Cloud.logout(); } }
};

function render() {
  renderHeader(); renderNav();
  { const fb = document.querySelector('.fab'); if (fb) fb.style.display = ((UI.tab === 'mappa' && UI.mapView === '3d') || UI.tab === 'inventario') ? 'none' : ''; }
  if (!loaded) { $('#view').innerHTML = '<div class="empty">Carico la cantina…</div>'; return; }
  const T = UI.tab;
  $('#view').innerHTML = (!S.bottles.length && ['stasera','cerca','mappa','stats'].includes(T)) ? emptyHtml() : T === 'stasera' ? viewStasera() : T === 'cerca' ? viewCerca() : T === 'mappa' ? viewMappa() : T === 'stats' ? viewStats() : T === 'avvisi' ? viewAvvisi() : T === 'storico' ? viewStorico() : T === 'guida' ? viewGuida() : T === 'riordino' ? viewRiordino() : T === 'spec' ? viewSpec() : T === 'novita' ? viewNovita() : T === 'inventario' ? viewInventario() : T === 'ricompra' ? viewRicompra() : T === 'completa' ? viewCompleta() : viewAltro();
  if (T === 'cerca' && $('#res')) { const s = document.querySelector('[data-bind="sort"]'); if (s) s.value = UI.sort; renderRes(); }
  if (T === 'mappa' && $('#cab')) renderCab();
  if (T === 'riordino' && $('#flist')) renderFillList();
}

function emptyHtml() {
  return `<div class="card" style="margin-top:20px;text-align:center;padding:26px 18px"><h2 style="margin-bottom:8px">La cantina è vuota</h2><div class="note" style="margin-bottom:16px">Importa il file con i tuoi vini oppure aggiungi la prima bottiglia.</div><button class="btn" data-act="import">Importa i dati iniziali</button><div style="height:10px"></div><button class="btn sec2" data-act="add">Aggiungi una bottiglia</button></div>`;
}
function bindEvents() {
  document.addEventListener('input', e => { const n = e.target && e.target.name, fm = e.target && e.target.form; if ((n === 'inizio' || n === 'fine') && fm) { if (fm.id === 'frm') updMatPrev(); else if (fm.id === 'cmpf') { const el = $('#cmpprev'); if (el) el.innerHTML = matPrevHtml(fm.elements['inizio'].value, fm.elements['fine'].value); } } });
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; e.preventDefault(); const f = ACT[el.dataset.act]; if (f) f(el); });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.bind;
    if (k === 'q') { UI.q = e.target.value; renderRes(); }
    else if (k === 'fq') { UI.fq = e.target.value; renderFillList(); }
    else if (k === 'ipq') { INV.pq = e.target.value; renderPickList(); }
    else if (k === 'mapQ') { UI.mapQ = e.target.value; if (UI.mapIds) { UI.mapIds = null; const bn = document.querySelector('#idban'); if (bn) bn.remove(); } renderCab(); }
  });
  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.bind;
    if (k === 'sort') { UI.sort = e.target.value; renderRes(); }
    else if (k === 'gone') { UI.gone = e.target.checked; render(); }
    else if (k === 'ftipo') { const sel = $('#posSel'); if (sel && sel.dataset.new) { const s = suggestSlot(e.target.value); if (s) sel.value = keyOf(s); } }
  });
  document.addEventListener('submit', e => { if (e.target.id === 'lf') { e.preventDefault(); doLogin(); } });
  window.addEventListener('resize', () => { if (UI.tab === 'mappa' && UI.mapView === '3d') schedule3D(); }); window.addEventListener('online', () => renderHeader()); window.addEventListener('offline', () => renderHeader());
  $('#fileFoto').addEventListener('change', async e => { const f = e.target.files[0], b = fotoFor && getB(fotoFor); if (f && b) { try { await setPhotoFor(b, f); save(); toast('Foto salvata'); openBottle(b.id); render(); } catch (x) { toast('Foto non letta'); } } e.target.value = ''; });
  $('#fileImp').addEventListener('change', async e => { const f = e.target.files[0]; if (f) await doImport(f); e.target.value = ''; });
}

async function init() {
  bindEvents();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !window.__CLOUD__) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  try { Cloud = window.__CLOUD__ || await makeFirebase(); }
  catch (e) { showLogin(e.message || 'Errore di avvio', true); return; }
  Cloud.onAuth(u => { if (u) { curUser = u; hideLogin(); startCloud(); } else { curUser = null; stopCloud(); showLogin(); render(); } });
}
init();
</script>
</body>
</html>
