<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>La mia cantinetta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>
:root{--bg:#12100f;--card:#1d1917;--card2:#26211e;--line:#3a312c;--txt:#f2ebe3;--mut:#a89b8d;--gold:#c9a96e;--wine:#8e2438;--ok:#4fa84a;--warn:#e8a928;--bad:#d1453b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(#12100f 80%,rgba(18,16,15,0))}
.brand{display:flex;gap:10px;align-items:center;color:var(--gold)}
.brand h1{font-size:19px;color:var(--txt);letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--mut)}
.bell{position:relative;color:var(--gold);padding:8px}
.bell b{position:absolute;top:2px;right:0;background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{padding:4px 16px}
.sec{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:18px}
.sec small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--mut);font-size:14px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1410;font-weight:600}
.lbl{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.bd{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.rec{background:linear-gradient(160deg,#241e1b,#1b1614);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;cursor:pointer}
.rec .t{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.rec h3{font-size:18px;line-height:1.25}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.pin{display:flex;gap:7px;align-items:center;margin-top:11px;color:var(--gold);font-size:14px}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.why span{font-size:12px;color:var(--mut);background:var(--card2);padding:4px 9px;border-radius:9px}
.why span.p{color:#e8d9b5;background:#3a2e1c}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--gold);color:#1a1410;font-weight:700;text-align:center}
.btn.sec2{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:500}
.btn.dng{background:none;color:var(--bad);border:1px solid #5b2a26}
.btns{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px}
.row{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid #2a231f;cursor:pointer}
.row .th{width:42px;height:42px;border-radius:50%;flex:none;background-size:cover;background-position:center;border:2px solid #0004;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.row .m{flex:1;min-width:0}
.row .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .m span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--gold);color:#1a1410;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #000a;z-index:25}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#171311ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--gold)}
/* map */
.cab{background:linear-gradient(#1a1513,#141110);border:2px solid #3b2f27;border-radius:16px;padding:10px 10px 4px}
.shelf{margin-bottom:12px}
.shl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:0 2px 6px}
.shl b{color:var(--gold);font-weight:600}
.sr{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sr .rl{width:38px;flex:none;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#6f6359}
.sg{flex:1;display:grid;gap:5px}
.board{height:6px;border-radius:3px;background:linear-gradient(#6b4a2d,#42301f);margin:3px 0 0 44px}
.slot{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
.slot i{font-style:normal;font-size:10.5px;font-weight:700}
.slot.e{border:1.5px dashed #3d332d}
.slot.b{background:var(--c);border:3px solid var(--r);box-shadow:inset 0 0 0 2px #0003}
.slot.dim{opacity:.18}
.slot.hit{box-shadow:0 0 0 3px #fff,0 0 14px 4px var(--gold);z-index:2}
.slot.mv{outline:3px solid #fff;outline-offset:2px}
.moving .slot.e{border-color:var(--gold);background:#c9a96e22}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:12px 2px;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.legend u{width:12px;height:12px;border-radius:50%;display:inline-block}
.banner{background:#3a2e1c;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.banner button{color:var(--gold);font-weight:700}
/* sheet */
#wrap{position:fixed;inset:0;z-index:50;display:none}
#wrap.open{display:block}
#bk{position:absolute;inset:0;background:#000b}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:#1b1715;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.grab{width:44px;height:5px;background:#4a3f38;border-radius:3px;margin:9px auto 12px}
.hero{height:150px;margin:0 -18px 14px;background-size:cover;background-position:center;position:relative}
.hero.nop{height:68px;margin-top:-12px;border-radius:22px 22px 0 0}
#sheet h2{font-size:23px;line-height:1.2}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0}
.kv div small{display:block;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.win{margin:16px 0 4px}
.track{position:relative;height:10px;border-radius:5px;display:flex;overflow:hidden}
.track i{display:block;height:100%}
.mark{position:absolute;top:-5px;width:3px;height:20px;background:#fff;border-radius:2px;box-shadow:0 0 6px #000}
.wl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;letter-spacing:.4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--mut);line-height:1.5}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi b{font-family:Georgia,serif;font-size:25px;color:var(--gold);display:block}
.kpi small{color:var(--mut);font-size:12px}
.bar{display:grid;grid-template-columns:96px 1fr 46px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px}
.bar .v{text-align:right;color:var(--mut)}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:8px 0}
.stack i{display:block;height:100%}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mut);min-width:0}
.cols i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.cols span{margin-top:4px;white-space:nowrap}
.cols em{font-style:normal;font-size:10px;color:var(--txt);margin-bottom:2px}
.ins{background:#2a2118;border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px;margin:10px 0;line-height:1.45}
.ok{color:var(--ok);font-size:14px;padding:8px 2px}
.menu .row{padding:15px 4px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#e8d9b5;color:#1a1410;padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
#login .box{width:100%;max-width:380px}
.ev{display:grid;grid-template-columns:72px 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid #2a231f;font-size:13px}
.ev span{color:var(--mut);grid-row:span 2}
.ev b{font-weight:600}
.ev i{font-style:normal;color:var(--mut)}
.err{color:var(--bad);font-size:14px;margin:10px 0;min-height:20px;line-height:1.4}
</style>
</head>
<body>
<div id="app"><header id="hdr"></header><main id="view"></main></div>
<button class="fab" data-act="add" aria-label="Aggiungi bottiglia"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav><div id="nav"></div></nav>
<div id="wrap"><div id="bk" data-act="closeSheet"></div><div id="sheet"></div></div>
<div id="toast"></div>
<div id="login"></div>
<input type="file" id="fileImp" accept="application/json,.json" hidden>
<input type="file" id="fileFoto" accept="image/*" hidden>

<script>
/* ============ DATI INIZIALI ============ */
const SEED_SHELVES = [{n:1,cap:12,rows:2},{n:2,cap:12,rows:2},{n:3,cap:12,rows:2},{n:4,cap:12,rows:2},{n:5,cap:12,rows:2},{n:6,cap:6,rows:1}];

/* ============ UTILITA ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const YEAR = new Date().getFullYear();
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const eur = n => (Math.round(n) || 0).toLocaleString('it-IT') + ' €';
const fmtDate = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '';
const fmtMonth = d => d ? String(d).slice(5, 7) + '/' + String(d).slice(0, 4) : '';
const ICON = {
  glass:'<path d="M8 3h8l-.5 6a3.5 3.5 0 0 1-7 0L8 3z"/><path d="M12 12.5V20M8.5 20h7"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  map:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16M4 14.5h16"/>',
  chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  menu:'<path d="M5 7h14M5 12h14M5 17h14"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  pin:'<path d="M12 21s6-5.5 6-10a6 6 0 0 0-12 0c0 4.5 6 10 6 10z"/><circle cx="12" cy="11" r="2"/>',
  cam:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  chev:'<path d="M9 6l6 6-6 6"/>'
};
const ic = (k, s) => `<svg class="i" viewBox="0 0 24 24"${s ? ` style="width:${s}px;height:${s}px"` : ''}>${ICON[k]}</svg>`;

const MAT = {
  'Attendere':{bg:'#bdd7ee',fg:'#1f3864'}, 'Pronto':{bg:'#c9e3b9',fg:'#27471a'}, 'Al meglio':{bg:'#4fa84a',fg:'#fff'},
  'Da bere presto':{bg:'#ffc000',fg:'#2b2000'}, 'Oltre finestra':{bg:'#c0392b',fg:'#fff'}, 'Finestra mancante':{bg:'#f1e1a6',fg:'#5b4a00'}, '-':{bg:'#444',fg:'#ddd'}
};
const TIPI = ['Rosso','Bianco','Rosato','Champagne','Spumante','Dolce/Passito'];
const TIPO_COL = {'Rosso':'#9b2335','Bianco':'#e6e3a1','Rosato':'#ee9fb0','Champagne':'#f2c14e','Spumante':'#7cc8c0','Dolce/Passito':'#d98e3f'};
const PAESE_COL = {'Italia':'#5b9a5f','Francia':'#5b84c4','Germania':'#d9b43a','Spagna':'#d9733a','Austria':'#c45b5b','Portogallo':'#4fa7a0','Altro':'#8a8178'};
const PREZZO_B = [{l:'< 20 €',max:20,c:'#ecdcae'},{l:'20–39 €',max:40,c:'#d4b062'},{l:'40–69 €',max:70,c:'#b07d2c'},{l:'70 € e oltre',max:1e9,c:'#7a4a12'}];
const isBolle = t => t === 'Champagne' || t === 'Spumante';
const ink = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1b1410' : '#fff'; };
const badge = m => `<span class="bd" style="background:${MAT[m].bg};color:${MAT[m].fg}">${esc(m)}</span>`;

/* ============ STATO E SINCRONIZZAZIONE (Firebase) ============ */
let S = { bottles: [], shelves: JSON.parse(JSON.stringify(SEED_SHELVES)) };
let loaded = false, Cloud = null, unsub = null, curUser = null, sheetId = null, suppressEvents = false;
let syncInfo = { pending: false, cache: false }, synced = {}, syncedShelves = '';
const sj = v => v === null || typeof v !== 'object' ? JSON.stringify(v) : Array.isArray(v) ? '[' + v.map(sj).join(',') + ']' : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + sj(v[k])).join(',') + '}';
const clean = o => JSON.parse(JSON.stringify(o));
const EVL = { acquistata:'Acquistata', collocata:'Collocata', spostata:'Spostata', bevuta:'Stappata', regalata:'Regalata', persa:'Persa/difettosa', rimessa:'Rimessa in cantina', eliminata:'Eliminata' };
const AUTH_MSG = { 'auth/invalid-credential':'Email o password non corretti', 'auth/wrong-password':'Email o password non corretti', 'auth/user-not-found':'Email o password non corretti', 'auth/invalid-email':'Email non valida', 'auth/too-many-requests':'Troppi tentativi: riprova tra qualche minuto', 'auth/network-request-failed':'Nessuna connessione' };

async function makeFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /INCOLLA/.test(cfg.apiKey)) throw new Error('Configurazione mancante: il file config.js non contiene ancora i dati del progetto Firebase.');
  const base = 'https://www.gstatic.com/firebasejs/11.0.2/';
  let A, Au, F;
  try { [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]); }
  catch (e) { throw new Error('Impossibile caricare Firebase: controlla la connessione e riprova.'); }
  const app = A.initializeApp(cfg), auth = Au.getAuth(app);
  const db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const col = n => F.collection(db, n);
  return {
    onAuth: cb => Au.onAuthStateChanged(auth, cb),
    login: (e, p) => Au.signInWithEmailAndPassword(auth, e, p),
    logout: () => Au.signOut(auth),
    subscribe(h) {
      const u1 = F.onSnapshot(col('bottles'), { includeMetadataChanges: true }, s => h.onBottles(s.docs.map(d => d.data()), { pending: s.metadata.hasPendingWrites, cache: s.metadata.fromCache }), e => h.onError(e));
      const u2 = F.onSnapshot(F.doc(db, 'meta', 'shelves'), s => h.onShelves(s.exists() ? s.data().list : null), e => h.onError(e));
      return () => { u1(); u2(); };
    },
    setBottle: b => F.setDoc(F.doc(db, 'bottles', b.id), b),
    delBottle: id => F.deleteDoc(F.doc(db, 'bottles', id)),
    setShelves: list => F.setDoc(F.doc(db, 'meta', 'shelves'), { list }),
    addEvent: e => F.addDoc(col('events'), e),
    async getEvents(id) { const s = await F.getDocs(F.query(col('events'), F.where('bottleId', '==', id))); return s.docs.map(d => d.data()); },
    async getPhoto(id) { const s = await F.getDoc(F.doc(db, 'photos', id)); return s.exists() ? s.data().full : null; },
    setPhoto: (id, full) => F.setDoc(F.doc(db, 'photos', id), { full }),
    delPhoto: id => F.deleteDoc(F.doc(db, 'photos', id)),
    async allPhotos() { const s = await F.getDocs(col('photos')), o = {}; s.docs.forEach(d => o[d.id] = d.data().full); return o; }
  };
}
function onErr(e) { console.error(e); toast(e && e.code === 'permission-denied' ? 'Permesso negato: controlla le regole del database' : 'Salvataggio non riuscito'); }
function logEv(b, type, testo) { if (!Cloud) return; Cloud.addEvent({ bottleId: b.id, name: title(b) + ' ' + vint(b), type, at: new Date().toISOString(), testo: testo || '' }).catch(() => {}); }
function deriveEvents(old, nw) {
  if (!old) {
    logEv(nw, 'acquistata', [nw.prezzo ? eur(nw.prezzo) : '', nw.dataAcquisto ? fmtDate(nw.dataAcquisto) : ''].filter(Boolean).join(' · '));
    if (nw.stato === 'In cantina' && validSlot(nw)) logEv(nw, 'collocata', slotLabel(nw.piano, nw.posto));
    return;
  }
  if (old.stato !== nw.stato) {
    if (nw.stato === 'In cantina') logEv(nw, 'rimessa', nw.piano ? slotLabel(nw.piano, nw.posto) : '');
    else logEv(nw, { 'Bevuta':'bevuta', 'Regalata':'regalata', 'Persa/Difettosa':'persa' }[nw.stato] || 'bevuta', [nw.dataConsumo ? fmtDate(nw.dataConsumo) : '', nw.voto != null ? 'voto ' + nw.voto + '/10' : '', nw.note || ''].filter(Boolean).join(' · '));
  } else if (nw.stato === 'In cantina' && nw.piano && (old.piano !== nw.piano || old.posto !== nw.posto)) {
    logEv(nw, 'spostata', (old.piano ? slotShort(old.piano, old.posto) : 'senza posto') + ' → ' + slotShort(nw.piano, nw.posto));
  }
}
function save() {
  if (!Cloud || !loaded) return;
  const ids = new Set();
  for (const b of S.bottles) {
    ids.add(b.id); const j = sj(b);
    if (synced[b.id] !== j) {
      const old = synced[b.id] ? JSON.parse(synced[b.id]) : null;
      synced[b.id] = j;
      if (!suppressEvents) deriveEvents(old, b);
      Cloud.setBottle(clean(b)).catch(onErr);
    }
  }
  for (const id of Object.keys(synced)) if (!ids.has(id)) {
    const old = JSON.parse(synced[id]); delete synced[id];
    Cloud.delBottle(id).catch(onErr); Cloud.delPhoto(id).catch(() => {});
    if (!suppressEvents) logEv(old, 'eliminata', 'Eliminata dai dati');
  }
  const sh = sj(S.shelves);

const getB = id => S.bottles.find(b => b.id === id);
const inC = () => S.bottles.filter(b => b.stato === 'In cantina');

const title = b => b.vino || b.produttore;
const vint = b => b.annata || 'NV';
function mat(b) {
  if (b.stato !== 'In cantina') return '-';
  if (!b.inizio || !b.fine) return 'Finestra mancante';
  const y = YEAR;
  if (y < b.inizio) return 'Attendere';
  if (y > b.fine) return 'Oltre finestra';
  const p = b.fine > b.inizio ? (y - b.inizio) / (b.fine - b.inizio) : 1;
  if (b.fine - y <= 1 || p >= .75) return 'Da bere presto';
  if (p >= .25) return 'Al meglio';
  return 'Pronto';
}
const byFine = (a, b) => (a.fine || 9999) - (b.fine || 9999) || (a.inizio || 0) - (b.inizio || 0);
const shelf = n => S.shelves.find(s => s.n === n);
const colsOf = sh => Math.ceil(sh.cap / sh.rows);
function rc(sh, p) { const c = colsOf(sh); return { row: Math.floor((p - 1) / c), col: (p - 1) % c }; }
function rowName(sh, r) { if (sh.rows === 1) return ''; if (sh.rows === 2) return r === 0 ? 'davanti' : 'dietro'; return 'fila ' + (r + 1); }
function shelfName(n) { return 'Ripiano ' + n + (n === 1 ? ' (alto)' : (n === S.shelves.length && n === 6 ? ' (a terra)' : '')); }
function slotLabel(piano, posto) {
  const sh = shelf(piano); if (!sh) return 'Posizione non valida';
  const { row, col } = rc(sh, posto); const rn = rowName(sh, row);
  return shelfName(piano) + ' · ' + (rn ? rn + ' · ' : '') + (col + 1) + 'ª da sinistra';
}
function slotShort(piano, posto) {
  const sh = shelf(piano); if (!sh) return '?'; const { row } = rc(sh, posto); const rn = rowName(sh, row);
  return 'Rip. ' + piano + (rn ? ' · ' + rn : '');
}
function occupancy() {
  const occ = {}, dup = [];
  inC().forEach(b => { if (b.piano && b.posto) { const k = b.piano + '-' + b.posto; if (!occ[k]) occ[k] = b; else dup.push(b); } });
  return { occ, dup };
}
function validSlot(b) { const sh = b.piano && shelf(b.piano); return !!(sh && b.posto >= 1 && b.posto <= sh.cap); }
function unplaced() {
  const { occ } = occupancy();
  return inC().filter(b => !b.piano || !b.posto || !validSlot(b) || occ[b.piano + '-' + b.posto] !== b);
}
function freeSlots() {
  const { occ } = occupancy(), out = [];
  S.shelves.forEach(sh => { for (let p = 1; p <= sh.cap; p++) if (!occ[sh.n + '-' + p]) out.push({ piano: sh.n, posto: p }); });
  return out;
}
function suggestSlot(tipo) {
  const free = freeSlots(); if (!free.length) return null;
  const last = S.shelves.length;
  const pref = tipo === 'Rosso' ? [1, 2, 3, 4, 5] : (tipo === 'Bianco' || tipo === 'Rosato' || tipo === 'Dolce/Passito') ? [3, 4, 2, 5, 1] : [5, 4, 3, 2, 1];
  pref.push(last);
  for (const n of pref) { const f = free.find(s => s.piano === n); if (f) return f; }
  return free[0];
}
function blockers(b) {
  if (!validSlot(b)) return [];
  const sh = shelf(b.piano), c = colsOf(sh), { row } = rc(sh, b.posto), { occ } = occupancy(), out = [];
  for (let k = 1; k <= row; k++) { const o = occ[b.piano + '-' + (b.posto - c * k)]; if (o) out.push(o); }
  return out;
}

/* ============ ABBINAMENTI ============ */
const TAGS = ['Aperitivo','Pesce','Crostacei e crudo','Fritto','Salumi','Formaggi','Pasta e risotti','Verdure','Carni bianche','Carne rossa','Brasati e selvaggina','Piccante e asiatico'];
const RULES_W = [
  [/riesling/, ['Pesce','Piccante e asiatico','Crostacei e crudo','Formaggi']],
  [/sauvignon/, ['Verdure','Pesce','Formaggi','Crostacei e crudo']],
  [/verdicchio/, ['Pesce','Fritto','Pasta e risotti','Crostacei e crudo']],
  [/timorasso/, ['Pesce','Carni bianche','Formaggi','Pasta e risotti']],
  [/aligot/, ['Aperitivo','Verdure','Pesce','Formaggi']],
  [/friulano|pinot blanc|grechetto|carricante|grecanico/, ['Pesce','Verdure','Formaggi','Aperitivo']],
  [/chardonnay/, ['Pesce','Carni bianche','Pasta e risotti','Formaggi']]
];
const RULES_R = [
  [/nebbiolo/, ['Brasati e selvaggina','Carne rossa','Formaggi','Pasta e risotti']],
  [/pinot (noir|nero)|gamay|schiava/, ['Salumi','Carni bianche','Pasta e risotti','Verdure']],
  [/sangiovese|canaiolo/, ['Pasta e risotti','Carne rossa','Salumi','Formaggi']],
  [/syrah|shiraz/, ['Carne rossa','Brasati e selvaggina','Piccante e asiatico','Formaggi']],
  [/cabernet franc/, ['Carne rossa','Salumi','Carni bianche','Formaggi']],
  [/cabernet sauvignon|merlot|petit verdot/, ['Carne rossa','Brasati e selvaggina','Formaggi']],
  [/grenache|garnacha|mourv|carignan|tempranillo/, ['Carne rossa','Brasati e selvaggina','Formaggi']],
  [/corvin|rondinella/, ['Carne rossa','Formaggi','Pasta e risotti']]
];
function pairing(b) {
  const txt = norm([b.vitigni, b.denominazione, b.vino].join(' '));
  const set = new Set(); let tags = [];
  if (isBolle(b.tipo)) {
    tags = ['Aperitivo','Fritto','Salumi','Crostacei e crudo'];
    const v = norm(b.vitigni);
    if (v && !/chardonnay/.test(v)) tags = ['Aperitivo','Salumi','Carni bianche','Pasta e risotti'];
    else if (/^\s*chardonnay\s*$/.test(v)) tags = ['Aperitivo','Crostacei e crudo','Pesce','Fritto'];
  } else {
    const rules = b.tipo === 'Rosso' ? RULES_R : RULES_W;
    for (const [re, t] of rules) if (re.test(txt)) { tags = t; break; }
    if (!tags.length) tags = b.tipo === 'Rosso' ? ['Carne rossa','Formaggi'] : b.tipo === 'Rosato' ? ['Aperitivo','Pesce','Salumi'] : b.tipo === 'Dolce/Passito' ? ['Formaggi'] : ['Pesce','Verdure'];
    if (b.tipo === 'Bianco' && /chardonnay/.test(txt) && /borgogna/.test(norm(b.regione))) tags = ['Pesce','Crostacei e crudo','Carni bianche','Pasta e risotti'];
  }
  tags.forEach(t => set.add(t));
  return [...set].slice(0, 5);
}
function serveTemp(b) {
  const txt = norm([b.vitigni, b.regione].join(' '));
  if (b.tipo === 'Champagne') return '8–10 °C';
  if (b.tipo === 'Spumante') return '6–8 °C';
  if (b.tipo === 'Bianco') return (/chardonnay/.test(txt) && /borgogna/.test(txt)) ? '10–12 °C' : '8–10 °C';
  if (b.tipo === 'Rosato' || b.tipo === 'Dolce/Passito') return '8–10 °C';
  return /pinot (noir|nero)|gamay|schiava/.test(txt) ? '14–16 °C' : '16–18 °C';
}

function colorOf(b) {

}

/* ============ CONSIGLIO: COSA BEVO ============ */
function recommend() {
  const out = [];
  inC().forEach(b => {
    const m = mat(b); const base = { 'Oltre finestra':100, 'Da bere presto':80, 'Al meglio':55, 'Pronto':35, 'Finestra mancante':20 }[m];
    if (base === undefined) return;
    if (UI.pTipo === 'Rosso' && b.tipo !== 'Rosso') return;
    if (UI.pTipo === 'Bianco' && b.tipo !== 'Bianco') return;
    if (UI.pTipo === 'Bollicine' && !isBolle(b.tipo)) return;
    if (UI.pTipo === 'Altro' && (b.tipo === 'Rosso' || b.tipo === 'Bianco' || isBolle(b.tipo))) return;
    let s = base, why = [];
    const left = b.fine ? b.fine - YEAR : 10;
    if (m === 'Oltre finestra') why.push('Finestra superata: da bere ora');
    else if (m === 'Da bere presto') why.push('Chiude nel ' + b.fine);
    else if (m === 'Al meglio') why.push('Nel momento migliore (' + b.inizio + '–' + b.fine + ')');
    else if (m === 'Pronto') why.push('Già pronto, finestra fino al ' + b.fine);
    s += Math.max(0, 10 - left) * 2;
    const tags = pairing(b);
    if (UI.dish !== 'Nessuno') { if (tags.includes(UI.dish)) { s += 40; why.push('Va con: ' + UI.dish.toLowerCase()); } else s -= 30; }
    const pr = b.prezzo || 0;
    if (UI.occ === 'Quotidiana') { if (pr <= 25) { s += 30; why.push('Prezzo da tutti i giorni'); } else if (pr > 40) s -= 30; }
    if (UI.occ === 'Cena tra amici') { if (pr >= 20 && pr <= 60) s += 15; if (pr > 90) s -= 15; }
    if (UI.occ === 'Romantica') { if (isBolle(b.tipo)) { s += 20; why.push('Bollicine: festa a due'); } if (pr >= 40) s += 10; }
    if (UI.occ === 'Speciale') { if (pr >= 60) { s += 40; why.push('Bottiglia importante'); } else if (pr < 30) s -= 20; if (m === 'Attendere') return; }
    const bl = blockers(b); if (!bl.length) s += 8; else s -= 8;
    out.push({ b, s, why, tags });
  });
  return out.sort((a, c) => c.s - a.s);
}

/* ============ STATISTICHE ============ */
function bars(rows, fmt) {
  const mx = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="bar"><span class="n">${esc(r.l)}</span><div class="tr"><i style="width:${Math.max(3, r.v / mx * 100)}%;background:${r.c || 'var(--gold)'}"></i></div><span class="v">${fmt ? fmt(r.v) : r.v}</span></div>`).join('');
}
function countBy(arr, fn) { const m = {}; arr.forEach(x => { const k = fn(x); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function colsChart(items) {
  const mx = Math.max(1, ...items.map(i => i[1]));
  return `<div class="cols">${items.map(i => `<div><em>${i[1] || ''}</em><i style="height:${i[1] / mx * 78}%"></i><span>${esc(i[0])}</span></div>`).join('')}</div>`;
}
function viewStats() {
  const c = inC(), g = outC(), tot = c.reduce((a, b) => a + (b.prezzo || 0), 0);
  const drunk = g.filter(b => b.stato === 'Bevuta'), voti = drunk.filter(b => b.voto != null);
  const vm = voti.length ? (voti.reduce((a, b) => a + b.voto, 0) / voti.length).toFixed(1) : '—';
  const tipo = TIPI.map(t => ({ l: t, v: c.filter(b => b.tipo === t).length, c: TIPO_COL[t] })).filter(x => x.v);
  const matL = ['Attendere','Pronto','Al meglio','Da bere presto','Oltre finestra','Finestra mancante'].map(m => ({ m, v: c.filter(b => mat(b) === m).length })).filter(x => x.v);
  const paese = countBy(c, b => b.paese), reg = countBy(c, b => b.regione);
  const topReg = reg[0], share = topReg ? Math.round(topReg[1] / c.length * 100) : 0;
  const ann = {}; c.forEach(b => { if (b.annata) ann[b.annata] = (ann[b.annata] || 0) + 1; });
  const ys = Object.keys(ann).map(Number); const y0 = ys.length ? Math.min(...ys) : YEAR, y1 = ys.length ? Math.max(...ys) : YEAR;
  const annItems = []; for (let y = Math.max(y0, y1 - 12); y <= y1; y++) annItems.push([String(y).slice(2), ann[y] || 0]);
  const fineMap = {}; c.forEach(b => { if (b.fine) fineMap[b.fine] = (fineMap[b.fine] || 0) + 1; });
  const fy = Object.keys(fineMap).map(Number); const fineItems = []; if (fy.length) for (let y = Math.min(YEAR, ...fy); y <= Math.min(Math.max(...fy), YEAR + 14); y++) fineItems.push([String(y).slice(2), fineMap[y] || 0]);
  const fasce = PREZZO_B.map(p => ({ l: p.l, v: c.filter(b => (b.prezzo || 0) < p.max && (b.prezzo || 0) >= (PREZZO_B[PREZZO_B.indexOf(p) - 1]?.max || 0)).length, c: p.c }));
  const vit = {}; c.forEach(b => (b.vitigni || '').split(',').map(s => s.trim()).filter(Boolean).forEach(v => { const k = v.charAt(0).toUpperCase() + v.slice(1).toLowerCase(); vit[k] = (vit[k] || 0) + 1; }));
  const vitTop = Object.entries(vit).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const prod = countBy(c, b => b.produttore).filter(x => x[1] >= 2).slice(0, 6);
  const shelves = S.shelves.map(sh => ({ l: 'Ripiano ' + sh.n, v: c.filter(b => b.piano === sh.n).length, cap: sh.cap }));
  const pronte = c.filter(b => ['Pronto','Al meglio','Da bere presto','Oltre finestra'].includes(mat(b))).length;
  const care = c.filter(b => b.prezzo).sort((a, b) => b.prezzo - a.prezzo)[0];
  return `<div class="kpis"><div class="kpi"><b>${c.length}</b><small>bottiglie in cantina</small></div><div class="kpi"><b>${eur(tot)}</b><small>valore stimato (prezzo d'acquisto)</small></div>
  <div class="kpi"><b>${eur(c.length ? tot / c.length : 0)}</b><small>prezzo medio</small></div><div class="kpi"><b>${pronte}</b><small>pronte da bere oggi</small></div>
  <div class="kpi"><b>${drunk.length}</b><small>bevute registrate</small></div><div class="kpi"><b>${vm}</b><small>voto medio (0–10)</small></div></div>
  ${topReg ? `<div class="ins">Il <b>${share}%</b> della cantina è ${esc(topReg[0])} (${topReg[1]} bottiglie)${reg[1] ? `, poi ${esc(reg[1][0])} con ${reg[1][1]}` : ''}.${care ? ` La bottiglia più costosa è ${esc(title(care))} (${eur(care.prezzo)}).` : ''}</div>` : ''}
  <div class="sec"><h2>Per tipo</h2></div><div class="card">${bars(tipo)}</div>
  <div class="sec"><h2>Stato di maturità</h2></div><div class="card"><div class="stack">${matL.map(x => `<i style="width:${x.v / c.length * 100}%;background:${MAT[x.m].bg}"></i>`).join('')}</div><div class="legend" style="margin:6px 0 0">${matL.map(x => `<span><u style="background:${MAT[x.m].bg}"></u>${x.m}: ${x.v}</span>`).join('')}</div></div>
  <div class="sec"><h2>Quando le berrai</h2><small>bottiglie per anno di fine finestra</small></div><div class="card">${colsChart(fineItems)}</div>

  <div class="sec"><h2>Annate</h2></div><div class="card">${colsChart(annItems)}<div class="sub">${c.filter(b => !b.annata).length ? c.filter(b => !b.annata).length + ' bottiglie multi-annata/NV non incluse' : ''}</div></div>

  <div class="sec"><h2>Storico</h2></div><div class="card"><div class="legend" style="margin:0 0 6px"><span>Bevute: ${drunk.length}</span><span>Regalate: ${g.filter(b => b.stato === 'Regalata').length}</span><span>Perse: ${g.filter(b => b.stato === 'Persa/Difettosa').length}</span></div>${g.length ? g.slice().sort((a, b) => String(b.dataConsumo || '').localeCompare(String(a.dataConsumo || ''))).slice(0, 5).map(rowHtml).join('') : '<div class="empty">Ancora nulla</div>'}</div>`;
}

function windowBar(b) {
  if (!b.inizio || !b.fine) return '<div class="note">Finestra di consumo non indicata.</div>';

  const r = MAT['Pronto'].bg, g = MAT['Al meglio'].bg, a = MAT['Da bere presto'].bg;
  const left = b.fine - YEAR;
  return `<div class="win"><div class="track"><i style="width:25%;background:${r}"></i><i style="width:50%;background:${g}"></i><i style="width:25%;background:${a}"></i><div class="mark" style="left:calc(${p * 100}% - 1px)"></div></div>
  <div class="wl"><span>${b.inizio}</span><span>${left >= 0 ? (left === 0 ? 'ultimo anno' : left + (left === 1 ? ' anno' : ' anni') + ' alla fine') : 'oltre di ' + (-left) + (left === -1 ? ' anno' : ' anni')}</span><span>${b.fine}</span></div></div>`;
}

  <datalist id="dlp">${paesi.map(p => `<option>${esc(p)}</option>`).join('')}</datalist><datalist id="dlr">${regs.map(p => `<option>${esc(p)}</option>`).join('')}</datalist>
  ${F('Denominazione', 'denominazione', b.denominazione)}${F('Vitigni (separati da virgola)', 'vitigni', b.vitigni)}
  <div class="g2">${F('Prezzo (€)', 'prezzo', b.prezzo, 'inputmode="decimal"')}${F('Sboccatura (solo bollicine)', 'sboccatura', b.sboccatura ? String(b.sboccatura).slice(0, 7) : '', 'type="month"')}</div>
  <div class="g2">${F('Finestra: da anno', 'inizio', b.inizio, 'inputmode="numeric"')}${F('Finestra: a anno', 'fine', b.fine, 'inputmode="numeric"')}</div>
  ${F('Data acquisto', 'dataAcquisto', b.dataAcquisto || (id ? '' : todayISO()), 'type="date"')}
  ${(b.stato === 'In cantina') ? `<div class="field"><label>Posizione</label><select name="pos" id="posSel" ${id ? '' : 'data-new="1"'}>${posOptions(id ? b : null, preset)}</select></div>` : ''}
  <div class="field"><label>Note</label><textarea name="note" rows="2">${esc(b.note || '')}</textarea></div>
  <div class="field"><label>Foto etichetta</label><input type="file" name="foto" id="fotoF" accept="image/*"></div>
  <button type="button" class="btn" data-act="saveForm" data-id="${id || ''}">Salva</button>
  ${id ? `<div style="height:10px"></div><button type="button" class="btn dng" data-act="delBottle" data-id="${id}">Elimina definitivamente</button>` : ''}</form>`);
}
function fileUrl(f) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(f); }); }
function shrink(url, max, q) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', q)); }; im.onerror = rej; im.src = url; }); }
async function setPhotoFor(b, file) { const u = await fileUrl(file), [full, th] = await Promise.all([shrink(u, 900, .72), shrink(u, 110, .7)]); b.thumb = th; Cloud.setPhoto(b.id, full).catch(onErr); }
async function saveForm(id) {
  const f = new FormData($('#frm')), g = k => (f.get(k) || '').toString().trim(), n = k => { const v = parseFloat(g(k).replace(',', '.')); return isNaN(v) ? null : v; };
  if (!g('vino')) { toast('Serve almeno il nome del vino'); return; }
  const b = id ? getB(id) : { id: 'N' + Date.now().toString(36), stato: 'In cantina' };
  Object.assign(b, { vino: g('vino'), produttore: g('produttore'), annata: n('annata'), tipo: g('tipo'), paese: g('paese') || null, regione: g('regione') || null, denominazione: g('denominazione') || null,
    vitigni: g('vitigni') || null, prezzo: n('prezzo'), sboccatura: g('sboccatura') ? g('sboccatura') + '-01' : null, inizio: n('inizio'), fine: n('fine'), dataAcquisto: g('dataAcquisto') || null, note: g('note') || null });
  if (b.annata != null) b.annata = Math.round(b.annata);
  if (b.stato === 'In cantina') {
    const pos = g('pos');
    if (pos) { const [p, s] = pos.split('-').map(Number); b.piano = p; b.posto = s; } else { b.piano = null; b.posto = null; }
  }
  if (!id) S.bottles.push(b);
  const file = f.get('foto'); if (file && file.size) { try { await setPhotoFor(b, file); } catch (e) { toast('Foto non letta'); } }
  save(); closeSheet(); toast(id ? 'Salvata' : 'Aggiunta in cantina'); render();
}

/* ============ AZIONI ============ */
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); }
let fotoFor = null;
function slotTap(s, p) {
  const { occ } = occupancy(), b = occ[s + '-' + p];
  if (UI.moving) {
    const m = getB(UI.moving);
    if (!b) { m.piano = s; m.posto = p; UI.moving = null; save(); toast('Spostata: ' + slotShort(s, p)); render(); return; }
    if (b === m) { UI.moving = null; render(); return; }
    if (confirm('Scambiare il posto con ' + title(b) + '?')) { const a = [m.piano, m.posto]; m.piano = s; m.posto = p; b.piano = a[0]; b.posto = a[1]; UI.moving = null; save(); toast('Scambiate'); render(); }
    return;
  }
  if (b) openBottle(b.id); else openForm(null, { piano: s, posto: p });
}
function openShelves() {
  openSheet(`<h2>Ripiani e file</h2><div class="note" style="margin:8px 0 14px">Imposta quanti posti ha ogni ripiano e se è a una o due file. Con due file i primi posti sono quelli davanti. Se cambi le file, i posti si ridistribuiscono: controlla la mappa.</div><form id="shf">
  ${S.shelves.map(s => `<div class="g2" style="margin-bottom:10px"><div class="field" style="margin:0"><label>${shelfName(s.n)} · posti</label><input name="cap${s.n}" type="number" min="0" max="30" value="${s.cap}"></div><div class="field" style="margin:0"><label>File</label><select name="rows${s.n}">${[1, 2, 3].map(r => `<option ${r === s.rows ? 'selected' : ''}>${r}</option>`).join('')}</select></div></div>`).join('')}
  <button type="button" class="btn" data-act="saveShelves">Salva</button></form>`);
}
function saveShelves() {
  const f = new FormData($('#shf'));
  S.shelves.forEach(s => { s.cap = Math.max(0, Math.min(30, parseInt(f.get('cap' + s.n)) || 0)); s.rows = parseInt(f.get('rows' + s.n)) || 1; });
  save(); closeSheet(); toast('Ripiani aggiornati'); render();
}
async function doExport() {
  toast('Preparo il backup…'); let photos = {};
  try { photos = await Cloud.allPhotos(); } catch (e) {}
  localStorage.setItem('cantinetta_lastBackup', todayISO());
  const blob = new Blob([JSON.stringify({ app: 'cantinetta', v: 2, exportedAt: new Date().toISOString(), bottles: S.bottles, shelves: S.shelves, photos })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cantinetta-backup-' + todayISO() + '.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Backup scaricato'); render();
}
async function doImport(file) {
  let st; try { const d = JSON.parse(await file.text()); st = d.state || d; if (!Array.isArray(st.bottles) || !Array.isArray(st.shelves)) throw 0; } catch (x) { toast('File non valido'); return; }
  if (!confirm('Importare ' + st.bottles.length + ' bottiglie? Sostituiscono i dati attuali.')) return;
  suppressEvents = true;
  try {
    S.bottles = st.bottles.map(clean); S.shelves = clean(st.shelves);
    for (const [id, p] of Object.entries(st.photos || {})) { const b = getB(id); if (!b || !p) continue; Cloud.setPhoto(id, p).catch(onErr); try { b.thumb = await shrink(p, 110, .7); } catch (e) {} }
    save();
  } finally { suppressEvents = false; }
  toast('Dati importati'); render();
}
function openInfo() {
  openSheet(`<h2>Il ciclo di vita</h2><div class="note" style="color:var(--txt);margin-top:10px;line-height:1.65">
  <b>Acquisto</b>: tasto + in basso a destra. Compili i dati, scegli il posto suggerito, salvi.<br>
  <b>Vita in cantina</b>: dalla scheda puoi spostare la bottiglia, aggiornare la finestra, aggiungere la foto dell'etichetta.<br>
  <b>Stappata</b>: dalla scheda, «L'abbiamo stappata», con voto da 0 a 10 e note. Il posto si libera da solo.<br>
  <b>Regalata o persa</b>: stessa procedura, scegli lo stato.<br>
  <b>Storia</b>: ogni scheda mostra data di acquisto, posti, spostamenti e consumo.</div>
  <div class="lbl">Ogni tanto</div><div class="note">Altro › Salva backup e conserva il file nel tuo OneDrive personale.</div>`);
}

const ACT = {
  tab: el => { UI.tab = el.dataset.v; closeSheet(); render(); window.scrollTo(0, 0); },
  set: el => { UI[el.dataset.k] = el.dataset.v; if (['occ','pTipo','dish'].includes(el.dataset.k)) UI.offset = 0; render(); },
  mode: el => { UI.mapMode = { 'Tipo':'tipo','Maturità':'mat','Paese':'paese','Prezzo':'prezzo' }[el.dataset.v]; render(); },
  more: () => { UI.offset++; render(); },
  open: el => openBottle(el.dataset.id),
  closeSheet: closeSheet,
  add: () => openForm(null),
  edit: el => openForm(el.dataset.id),
  drink: el => openDrink(el.dataset.id),
  confirmDrink: el => confirmDrink(el.dataset.id),
  rimetti: el => rimetti(el.dataset.id),
  saveForm: el => saveForm(el.dataset.id),
  delBottle: el => { if (confirm('Eliminare questa bottiglia dai dati? Non si può annullare.')) { S.bottles = S.bottles.filter(b => b.id !== el.dataset.id); save(); closeSheet(); toast('Eliminata'); render(); } },
  sposta: el => { UI.moving = el.dataset.id; UI.tab = 'mappa'; closeSheet(); render(); },
  cancelMove: () => { UI.moving = null; render(); },
  showmap: el => { const b = getB(el.dataset.id); UI.mapQ = title(b) + ' ' + (b.annata || ''); UI.tab = 'mappa'; closeSheet(); render(); },
  slot: el => slotTap(+el.dataset.s, +el.dataset.p),
  foto: el => { fotoFor = el.dataset.id; $('#fileFoto').click(); },
  storico: () => { UI.tab = 'storico'; render(); },
  shelves: openShelves, saveShelves: saveShelves, export: doExport, info: openInfo,
  import: () => $('#fileImp').click(),
  logout: () => { if (confirm('Uscire dall\'account?')) { closeSheet(); Cloud.logout(); } }
};

function render() {
  renderHeader(); renderNav();
  if (!loaded) { $('#view').innerHTML = '<div class="empty">Carico la cantina…</div>'; return; }
  const T = UI.tab;
  $('#view').innerHTML = (!S.bottles.length && ['stasera','cerca','mappa','stats'].includes(T)) ? emptyHtml() : T === 'stasera' ? viewStasera() : T === 'cerca' ? viewCerca() : T === 'mappa' ? viewMappa() : T === 'stats' ? viewStats() : T === 'avvisi' ? viewAvvisi() : T === 'storico' ? viewStorico() : viewAltro();
  if (T === 'cerca' && $('#res')) { const s = document.querySelector('[data-bind="sort"]'); if (s) s.value = UI.sort; renderRes(); }
  if (T === 'mappa' && $('#cab')) renderCab();
}

function emptyHtml() {
  return `<div class="card" style="margin-top:20px;text-align:center;padding:26px 18px"><h2 style="margin-bottom:8px">La cantina è vuota</h2><div class="note" style="margin-bottom:16px">Importa il file con i tuoi vini oppure aggiungi la prima bottiglia.</div><button class="btn" data-act="import">Importa i dati iniziali</button><div style="height:10px"></div><button class="btn sec2" data-act="add">Aggiungi una bottiglia</button></div>`;
}
function bindEvents() {
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; e.preventDefault(); const f = ACT[el.dataset.act]; if (f) f(el); });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.bind;
    if (k === 'q') { UI.q = e.target.value; renderRes(); }
    else if (k === 'mapQ') { UI.mapQ = e.target.value; renderCab(); }
  });
  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.bind;
    if (k === 'sort') { UI.sort = e.target.value; renderRes(); }
    else if (k === 'gone') { UI.gone = e.target.checked; render(); }
    else if (k === 'ftipo') { const sel = $('#posSel'); if (sel && sel.dataset.new) { const s = suggestSlot(e.target.value); if (s) sel.value = s.piano + '-' + s.posto; } }
  });
  document.addEventListener('submit', e => { if (e.target.id === 'lf') { e.preventDefault(); doLogin(); } });
  window.addEventListener('online', () => renderHeader()); window.addEventListener('offline', () => renderHeader());
  $('#fileFoto').addEventListener('change', async e => { const f = e.target.files[0], b = fotoFor && getB(fotoFor); if (f && b) { try { await setPhotoFor(b, f); save(); toast('Foto salvata'); openBottle(b.id); render(); } catch (x) { toast('Foto non letta'); } } e.target.value = ''; });
  $('#fileImp').addEventListener('change', async e => { const f = e.target.files[0]; if (f) await doImport(f); e.target.value = ''; });
}

async function init() {
  bindEvents();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !window.__CLOUD__) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  try { Cloud = window.__CLOUD__ || await makeFirebase(); }
  catch (e) { showLogin(e.message || 'Errore di avvio', true); return; }
  Cloud.onAuth(u => { if (u) { curUser = u; hideLogin(); startCloud(); } else { curUser = null; stopCloud(); showLogin(); render(); } });
}
init();
</script>
</body>
