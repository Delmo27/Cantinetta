<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>La mia cantinetta</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>
:root{--bg:#12100f;--card:#1d1917;--card2:#26211e;--line:#3a312c;--txt:#f2ebe3;--mut:#a89b8d;--gold:#c9a96e;--wine:#8e2438;--ok:#4fa84a;--warn:#e8a928;--bad:#d1453b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(#12100f 80%,rgba(18,16,15,0))}
.brand{display:flex;gap:10px;align-items:center;color:var(--gold)}
.brand h1{font-size:19px;color:var(--txt);letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--mut)}
.bell{position:relative;color:var(--gold);padding:8px}
.bell b{position:absolute;top:2px;right:0;background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{padding:4px 16px}
.sec{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:18px}
.sec small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--mut);font-size:14px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1410;font-weight:600}
.lbl{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.bd{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.rec{background:linear-gradient(160deg,#241e1b,#1b1614);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;cursor:pointer}
.rec .t{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.rec h3{font-size:18px;line-height:1.25}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.pin{display:flex;gap:7px;align-items:center;margin-top:11px;color:var(--gold);font-size:14px}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.why span{font-size:12px;color:var(--mut);background:var(--card2);padding:4px 9px;border-radius:9px}
.why span.p{color:#e8d9b5;background:#3a2e1c}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--gold);color:#1a1410;font-weight:700;text-align:center}
.btn.sec2{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:500}
.btn.dng{background:none;color:var(--bad);border:1px solid #5b2a26}
.btns{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px}
.row{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid #2a231f;cursor:pointer}
.row .th{width:42px;height:42px;border-radius:50%;flex:none;background-size:cover;background-position:center;border:2px solid #0004;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.row .m{flex:1;min-width:0}
.row .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .m span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--gold);color:#1a1410;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #000a;z-index:25}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#171311ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--gold)}
/* map */
.cab{background:linear-gradient(#1a1513,#141110);border:2px solid #3b2f27;border-radius:16px;padding:10px 10px 4px}
.shelf{margin-bottom:12px}
.shl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:0 2px 6px}
.shl b{color:var(--gold);font-weight:600}
.sr{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.sr .rl{width:38px;flex:none;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#6f6359}
.sg{flex:1;display:grid;gap:5px}
.board{height:6px;border-radius:3px;background:linear-gradient(#6b4a2d,#42301f);margin:3px 0 0 44px}
.slot{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
.slot i{font-style:normal;font-size:10.5px;font-weight:700}
.slot.e{border:1.5px dashed #3d332d}
.slot.b{background:var(--c);border:3px solid var(--r);box-shadow:inset 0 0 0 2px #0003}
.slot.dim{opacity:.18}
.slot.hit{box-shadow:0 0 0 3px #fff,0 0 14px 4px var(--gold);z-index:2}
.slot.mv{outline:3px solid #fff;outline-offset:2px}
.moving .slot.e{border-color:var(--gold);background:#c9a96e22}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:12px 2px;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.legend u{width:12px;height:12px;border-radius:50%;display:inline-block}
.banner{background:#3a2e1c;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.banner button{color:var(--gold);font-weight:700}
/* sheet */
#wrap{position:fixed;inset:0;z-index:50;display:none}
#wrap.open{display:block}
#bk{position:absolute;inset:0;background:#000b}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:#1b1715;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:0 18px calc(24px + env(safe-area-inset-bottom))}
.grab{width:44px;height:5px;background:#4a3f38;border-radius:3px;margin:9px auto 12px}
.hero{height:150px;margin:0 -18px 14px;background-size:cover;background-position:center;position:relative}
.hero.nop{height:68px;margin-top:-12px;border-radius:22px 22px 0 0}
#sheet h2{font-size:23px;line-height:1.2}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0}
.kv div small{display:block;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.win{margin:16px 0 4px}
.track{position:relative;height:10px;border-radius:5px;display:flex;overflow:hidden}
.track i{display:block;height:100%}
.mark{position:absolute;top:-5px;width:3px;height:20px;background:#fff;border-radius:2px;box-shadow:0 0 6px #000}
.wl{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;letter-spacing:.4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:13px;color:var(--mut);line-height:1.5}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi b{font-family:Georgia,serif;font-size:25px;color:var(--gold);display:block}
.kpi small{color:var(--mut);font-size:12px}
.bar{display:grid;grid-template-columns:96px 1fr 46px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:6px}
.bar .v{text-align:right;color:var(--mut)}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:8px 0}
.stack i{display:block;height:100%}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mut);min-width:0}
.cols i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.cols span{margin-top:4px;white-space:nowrap}
.cols em{font-style:normal;font-size:10px;color:var(--txt);margin-bottom:2px}
.ins{background:#2a2118;border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px;margin:10px 0;line-height:1.45}
.ok{color:var(--ok);font-size:14px;padding:8px 2px}
.menu .row{padding:15px 4px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#e8d9b5;color:#1a1410;padding:10px 16px;border-radius:12px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.clk{cursor:pointer}
.poschip{display:inline-block;min-height:28px;line-height:18px;padding:5px 10px;border:1px dashed var(--gold);border-radius:10px;color:var(--gold);font-size:12px;font-weight:600;background:#c9a96e14}
.poschip:active{opacity:.6}
.fillbar{position:sticky;top:62px;z-index:12;background:var(--bg);padding:4px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.fs{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid transparent;flex:none}
.fs.e{border:1.5px dashed #5a4a3d;color:#6f6359}
.fs.t{border:2px solid var(--gold);color:var(--gold);box-shadow:0 0 10px #c9a96e66;background:#c9a96e18}
.fs.b{border-color:#0005}
.fsl{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut)}
.stpb{width:46px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;line-height:1;color:var(--gold)}
.stpb:active{opacity:.6}
details.gd{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.gd summary{padding:14px;font-family:Georgia,"Times New Roman",serif;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.gd summary::-webkit-details-marker{display:none}
details.gd summary:after{content:"+";color:var(--gold);font-size:22px;font-family:-apple-system,"Segoe UI",sans-serif}
details.gd[open] summary:after{content:"\2212"}
.gdb{padding:0 14px 14px;color:var(--txt);line-height:1.6;font-size:14px}
.gdb p{margin:8px 0}
.gdb ul,.gdb ol{margin:6px 0;padding-left:20px}
.gdb li{margin:5px 0}
.gdb .k{display:inline-block;padding:1px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--gold);font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;flex:none;box-sizing:border-box}
.bar.clk:active,.cols div.clk:active,.kpi.clk:active,.legend span.clk:active{opacity:.55}
.legend span.clk{padding:4px 0}
a.btn{text-decoration:none}
details.rsd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 14px}
details.rsd summary{cursor:pointer;color:var(--gold);font-weight:600}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
#login .box{width:100%;max-width:380px}
.ev{display:grid;grid-template-columns:72px 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid #2a231f;font-size:13px}
.ev span{color:var(--mut);grid-row:span 2}
.ev b{font-weight:600}
.ev i{font-style:normal;color:var(--mut)}
.err{color:var(--bad);font-size:14px;margin:10px 0;min-height:20px;line-height:1.4}
</style>
</head>
<body>
<div id="app"><header id="hdr"></header><main id="view"></main></div>
<button class="fab" data-act="add" aria-label="Aggiungi bottiglia"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav><div id="nav"></div></nav>
<div id="wrap"><div id="bk" data-act="closeSheet"></div><div id="sheet"></div></div>
<div id="toast"></div>
<div id="login"></div>
<input type="file" id="fileImp" accept="application/json,.json" hidden>
<input type="file" id="fileFoto" accept="image/*" hidden>

<script>
/* ============ DATI INIZIALI ============ */
const SEED_SHELVES = [{n:1,lv:[{p:4,r:4},{p:4,r:4}]},{n:2,lv:[{p:4,r:4},{p:4,r:4}]},{n:3,lv:[{p:4,r:0},{p:4,r:0}]},{n:4,lv:[{p:4,r:4},{p:4,r:4}]},{n:5,lv:[{p:4,r:4},{p:4,r:4}]},{n:6,lv:[{p:4,r:4}]}];

/* ============ UTILITA ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const YEAR = new Date().getFullYear();
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const eur = n => (Math.round(n) || 0).toLocaleString('it-IT') + ' €';
const fmtDate = d => d ? String(d).slice(0, 10).split('-').reverse().join('/') : '';
const fmtMonth = d => d ? String(d).slice(5, 7) + '/' + String(d).slice(0, 4) : '';
const ICON = {
  glass:'<path d="M8 3h8l-.5 6a3.5 3.5 0 0 1-7 0L8 3z"/><path d="M12 12.5V20M8.5 20h7"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  map:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16M4 14.5h16"/>',
  chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
  menu:'<path d="M5 7h14M5 12h14M5 17h14"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  pin:'<path d="M12 21s6-5.5 6-10a6 6 0 0 0-12 0c0 4.5 6 10 6 10z"/><circle cx="12" cy="11" r="2"/>',
  cam:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  chev:'<path d="M9 6l6 6-6 6"/>'
};
const ic = (k, s) => `<svg class="i" viewBox="0 0 24 24"${s ? ` style="width:${s}px;height:${s}px"` : ''}>${ICON[k]}</svg>`;

const MAT = {
  'Attendere':{bg:'#bdd7ee',fg:'#1f3864'}, 'Pronto':{bg:'#c9e3b9',fg:'#27471a'}, 'Al meglio':{bg:'#4fa84a',fg:'#fff'},
  'Da bere presto':{bg:'#ffc000',fg:'#2b2000'}, 'Oltre finestra':{bg:'#c0392b',fg:'#fff'}, 'Finestra mancante':{bg:'#f1e1a6',fg:'#5b4a00'}, '-':{bg:'#444',fg:'#ddd'}
};
const TIPI = ['Rosso','Bianco','Rosato','Champagne','Spumante','Dolce/Passito'];
const TIPO_COL = {'Rosso':'#9b2335','Bianco':'#e6e3a1','Rosato':'#ee9fb0','Champagne':'#f2c14e','Spumante':'#7cc8c0','Dolce/Passito':'#d98e3f'};
const PAESE_COL = {'Italia':'#5b9a5f','Francia':'#5b84c4','Germania':'#d9b43a','Spagna':'#d9733a','Austria':'#c45b5b','Portogallo':'#4fa7a0','Altro':'#8a8178'};
const PREZZO_B = [{l:'< 20 €',max:20,c:'#ecdcae'},{l:'20–39 €',max:40,c:'#d4b062'},{l:'40–69 €',max:70,c:'#b07d2c'},{l:'70 € e oltre',max:1e9,c:'#7a4a12'}];
const isBolle = t => t === 'Champagne' || t === 'Spumante';
const ink = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1b1410' : '#fff'; };
const badge = m => `<span class="bd" style="background:${MAT[m].bg};color:${MAT[m].fg}">${esc(m)}</span>`;

/* ============ STATO E SINCRONIZZAZIONE (Firebase) ============ */
let S = { bottles: [], shelves: JSON.parse(JSON.stringify(SEED_SHELVES)) };
let loaded = false, Cloud = null, unsub = null, curUser = null, sheetId = null, suppressEvents = false;
let syncInfo = { pending: false, cache: false }, synced = {}, syncedShelves = '';
const sj = v => v === null || typeof v !== 'object' ? JSON.stringify(v) : Array.isArray(v) ? '[' + v.map(sj).join(',') + ']' : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + sj(v[k])).join(',') + '}';
const clean = o => JSON.parse(JSON.stringify(o));
const EVL = { acquistata:'Acquistata', collocata:'Collocata', spostata:'Spostata', bevuta:'Stappata', regalata:'Regalata', persa:'Persa/difettosa', rimessa:'Rimessa in cantina', eliminata:'Eliminata' };
const AUTH_MSG = { 'auth/invalid-credential':'Email o password non corretti', 'auth/wrong-password':'Email o password non corretti', 'auth/user-not-found':'Email o password non corretti', 'auth/invalid-email':'Email non valida', 'auth/too-many-requests':'Troppi tentativi: riprova tra qualche minuto', 'auth/network-request-failed':'Nessuna connessione' };

async function makeFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /INCOLLA/.test(cfg.apiKey)) throw new Error('Configurazione mancante: il file config.js non contiene ancora i dati del progetto Firebase.');
  const base = 'https://www.gstatic.com/firebasejs/11.0.2/';
  let A, Au, F;
  try { [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]); }
  catch (e) { throw new Error('Impossibile caricare Firebase: controlla la connessione e riprova.'); }
  const app = A.initializeApp(cfg), auth = Au.getAuth(app);
  const db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const col = n => F.collection(db, n);
  return {
    onAuth: cb => Au.onAuthStateChanged(auth, cb),
    login: (e, p) => Au.signInWithEmailAndPassword(auth, e, p),
    logout: () => Au.signOut(auth),
    subscribe(h) {
      const u1 = F.onSnapshot(col('bottles'), { includeMetadataChanges: true }, s => h.onBottles(s.docs.map(d => d.data()), { pending: s.metadata.hasPendingWrites, cache: s.metadata.fromCache }), e => h.onError(e));
      const u2 = F.onSnapshot(F.doc(db, 'meta', 'shelves'), s => h.onShelves(s.exists() ? s.data().list : null), e => h.onError(e));
      return () => { u1(); u2(); };
    },
    setBottle: b => F.setDoc(F.doc(db, 'bottles', b.id), b),
    delBottle: id => F.deleteDoc(F.doc(db, 'bottles', id)),
    setShelves: list => F.setDoc(F.doc(db, 'meta', 'shelves'), { list }),
    addEvent: e => F.addDoc(col('events'), e),

  [/chardonnay/, ['Pesce','Carni bianche','Pasta e risotti','Formaggi']]

  [/nebbiolo/, ['Brasati e selvaggina','Carne rossa','Formaggi','Pasta e risotti']],
  [/pinot (noir|nero)|gamay|schiava/, ['Salumi','Carni bianche','Pasta e risotti','Verdure']],

  [/grenache|garnacha|mourv|carignan|tempranillo/, ['Carne rossa','Brasati e selvaggina','Formaggi']],

function recommend() {
  const out = [];
  inC().forEach(b => {
    const m = mat(b); const base = { 'Oltre finestra':100, 'Da bere presto':80, 'Al meglio':55, 'Pronto':35, 'Finestra mancante':20 }[m];
    if (base === undefined) return;
    if (UI.pTipo === 'Rosso' && b.tipo !== 'Rosso') return;
    if (UI.pTipo === 'Bianco' && b.tipo !== 'Bianco') return;
    if (UI.pTipo === 'Bollicine' && !isBolle(b.tipo)) return;
    if (UI.pTipo === 'Altro' && (b.tipo === 'Rosso' || b.tipo === 'Bianco' || isBolle(b.tipo))) return;
    let s = base, why = [];
    const left = b.fine ? b.fine - YEAR : 10;
    if (m === 'Oltre finestra') why.push('Finestra superata: da bere ora');
    else if (m === 'Da bere presto') why.push('Chiude nel ' + b.fine);
    else if (m === 'Al meglio') why.push('Nel momento migliore (' + b.inizio + '–' + b.fine + ')');
    else if (m === 'Pronto') why.push('Già pronto, finestra fino al ' + b.fine);
    s += Math.max(0, 10 - left) * 2;
    const tags = pairing(b);
    if (UI.dish !== 'Nessuno') { if (tags.includes(UI.dish)) { s += 40; why.push('Va con: ' + UI.dish.toLowerCase()); } else s -= 30; }
    const pr = b.prezzo || 0;
    if (UI.occ === 'Quotidiana') { if (pr <= 25) { s += 30; why.push('Prezzo da tutti i giorni'); } else if (pr > 40) s -= 30; }
    if (UI.occ === 'Cena tra amici') { if (pr >= 20 && pr <= 60) s += 15; if (pr > 90) s -= 15; }
    if (UI.occ === 'Romantica') { if (isBolle(b.tipo)) { s += 20; why.push('Bollicine: festa a due'); } if (pr >= 40) s += 10; }
    if (UI.occ === 'Speciale') { if (pr >= 60) { s += 40; why.push('Bottiglia importante'); } else if (pr < 30) s -= 20; if (m === 'Attendere') return; }
    const bl = blockers(b); s -= bl.length * 6; if (bl.length) why.push('Prima togli ' + bl.length + (bl.length === 1 ? ' bottiglia' : ' bottiglie'));

  });

}

/* ============ STATISTICHE ============ */
function bars(rows, fmt, key) {
  const mx = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="bar ${key ? 'clk' : ''}" ${key ? `data-act="stat" data-k="${key}" data-v="${esc(String(r.k !== undefined ? r.k : r.l))}"` : ''}><span class="n">${esc(r.l)}</span><div class="tr"><i style="width:${Math.max(3, r.v / mx * 100)}%;background:${r.c || 'var(--gold)'}"></i></div><span class="v">${fmt ? fmt(r.v) : r.v}</span></div>`).join('');
}
function countBy(arr, fn) { const m = {}; arr.forEach(x => { const k = fn(x); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function colsChart(items, key) {
  const mx = Math.max(1, ...items.map(i => i[1]));
  return `<div class="cols">${items.map(i => `<div class="${i[1] ? 'clk' : ''}" ${i[1] ? `data-act="stat" data-k="${key}" data-v="${esc(String(i[2]))}"` : ''}><em>${i[1] || ''}</em><i style="height:${i[1] / mx * 78}%"></i><span>${esc(i[0])}</span></div>`).join('')}</div>`;
}
function statSel(k, v) {

  let t = '', l = [];
  if (k === 'all') { t = 'Bottiglie in cantina'; l = sortC(c); }
  else if (k === 'valore') { t = 'Dalla più costosa'; l = c.filter(b => b.prezzo).sort((a, b) => b.prezzo - a.prezzo); }
  else if (k === 'pronte') { t = 'Pronte da bere oggi'; l = sortC(c.filter(b => ['Pronto', 'Al meglio', 'Da bere presto', 'Oltre finestra'].includes(mat(b)))); }
  else if (k === 'bevute') { t = 'Bevute registrate'; l = sortG(g.filter(b => b.stato === 'Bevuta')); }
  else if (k === 'voto') { t = 'Bevute con voto'; l = g.filter(b => b.stato === 'Bevuta' && b.voto != null).sort((a, b) => b.voto - a.voto); }
  else if (k === 'tipo') { t = v; l = sortC(c.filter(b => b.tipo === v)); }
  else if (k === 'mat') { t = v; l = sortC(c.filter(b => mat(b) === v)); }
  else if (k === 'fine') { t = 'Finestra fino al ' + v; l = sortC(c.filter(b => String(b.fine) === v)); }
  else if (k === 'paese') { t = v; l = sortC(c.filter(b => b.paese === v)); }
  else if (k === 'regione') { t = v; l = sortC(c.filter(b => b.regione === v)); }
  else if (k === 'annata') { t = 'Annata ' + v; l = sortC(c.filter(b => String(b.annata) === v)); }
  else if (k === 'prezzo') { const i = Math.max(0, PREZZO_B.findIndex(p => p.l === v)), lo = i > 0 ? PREZZO_B[i - 1].max : 0, hi = PREZZO_B[i].max; t = 'Fascia ' + v; l = c.filter(b => (b.prezzo || 0) >= lo && (b.prezzo || 0) < hi).sort((a, b) => (b.prezzo || 0) - (a.prezzo || 0)); }
  else if (k === 'vitigno') { t = v; l = sortC(c.filter(b => (b.vitigni || '').split(',').some(x => norm(x.trim()) === norm(v)))); }
  else if (k === 'produttore') { t = v; l = sortC(c.filter(b => b.produttore === v)); }
  else if (k === 'ripiano') { t = 'Ripiano ' + v; l = c.filter(b => String(b.piano) === v).sort((a, b) => keyOf(a).localeCompare(keyOf(b))); }
  else if (k === 'stato') { t = v; l = sortG(g.filter(b => b.stato === v)); }

}

  const r = MAT['Pronto'].bg, g = MAT['Al meglio'].bg, a = MAT['Da bere presto'].bg;

function openReorder(list, freed, intro) {
  list = list.filter(validSlot); if (!list.length) return;
  const base = freeSlots().concat(list.map(b => ({ piano: b.piano, liv: b.liv, fila: b.fila, pos: b.pos }))), seen = new Set();
  const opts = base.filter(s => !seen.has(keyOf(s)) && seen.add(keyOf(s))).sort((a, c) => a.piano - c.piano || (a.liv === c.liv ? 0 : a.liv === 'B' ? -1 : 1) || (a.fila === c.fila ? 0 : a.fila === 'R' ? -1 : 1) || a.pos - c.pos);
  RS.reo = list.map(b => b.id);
  openSheet(`<h2>Riordino</h2><div class="sub" style="margin:3px 0 10px">${esc(intro)}</div><div class="note" style="margin-bottom:12px">Per ogni bottiglia indica dove l'hai rimessa. Lascia «dov'è ora» se è tornata al suo posto: l'app aggiorna i codici di quelle che hai cambiato di posto.</div><form id="rof">
  ${list.map(b => { const cur = keyOf(b); return `<div class="field"><label>${esc(title(b))} ${vint(b)} · ora ${cur}</label><select name="r_${b.id}">${opts.map(s => { const k = keyOf(s); return `<option value="${k}" ${k === cur ? 'selected' : ''}>${k}${k === cur ? " · dov'è ora" : ''}${k === freed ? ' · posto liberato' : ''}</option>`; }).join('')}</select></div>`; }).join('')}
  <button type="button" class="btn" data-act="applyReorder">Conferma</button><div style="height:10px"></div><button type="button" class="btn sec2" data-act="closeSheet">Lascia tutto com'è</button></form>`);
}
function applyReorder() {
  const f = new FormData($('#rof')), ids = RS.reo || [], bs = ids.map(getB).filter(Boolean), tg = bs.map(b => f.get('r_' + b.id));
  if (new Set(tg).size !== tg.length) { toast('Due bottiglie nello stesso posto'); return; }
  const { occ } = occupancy(), mine = new Set(ids);
  for (const k of tg) { const o = occ[k]; if (o && !mine.has(o.id)) { toast('Il posto ' + k + ' è occupato'); return; } }
  bs.forEach((b, i) => { const sl = parseKey(tg[i]); if (sl) { Object.assign(b, sl); delete b.posto; } });
  save(); closeSheet(); toast('Posizioni aggiornate'); render();
}
function rimetti(id) {

}

};

function render() {
  renderHeader(); renderNav();
  { const fb = document.querySelector('.fab'); if (fb) fb.style.display = (UI.tab === 'mappa' && UI.mapView === '3d') ? 'none' : ''; }
  if (!loaded) { $('#view').innerHTML = '<div class="empty">Carico la cantina…</div>'; return; }
  const T = UI.tab;
  $('#view').innerHTML = (!S.bottles.length && ['stasera','cerca','mappa','stats'].includes(T)) ? emptyHtml() : T === 'stasera' ? viewStasera() : T === 'cerca' ? viewCerca() : T === 'mappa' ? viewMappa() : T === 'stats' ? viewStats() : T === 'avvisi' ? viewAvvisi() : T === 'storico' ? viewStorico() : T === 'guida' ? viewGuida() : T === 'riordino' ? viewRiordino() : viewAltro();
  if (T === 'cerca' && $('#res')) { const s = document.querySelector('[data-bind="sort"]'); if (s) s.value = UI.sort; renderRes(); }
  if (T === 'mappa' && $('#cab')) renderCab();
  if (T === 'riordino' && $('#flist')) renderFillList();
}

function emptyHtml() {
  return `<div class="card" style="margin-top:20px;text-align:center;padding:26px 18px"><h2 style="margin-bottom:8px">La cantina è vuota</h2><div class="note" style="margin-bottom:16px">Importa il file con i tuoi vini oppure aggiungi la prima bottiglia.</div><button class="btn" data-act="import">Importa i dati iniziali</button><div style="height:10px"></div><button class="btn sec2" data-act="add">Aggiungi una bottiglia</button></div>`;
}
function bindEvents() {
  document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; e.preventDefault(); const f = ACT[el.dataset.act]; if (f) f(el); });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.bind;
    if (k === 'q') { UI.q = e.target.value; renderRes(); }
    else if (k === 'fq') { UI.fq = e.target.value; renderFillList(); }
    else if (k === 'mapQ') { UI.mapQ = e.target.value; if (UI.mapIds) { UI.mapIds = null; const bn = document.querySelector('#idban'); if (bn) bn.remove(); } renderCab(); }
  });
  document.addEventListener('change', e => {
    const k = e.target.dataset && e.target.dataset.bind;
    if (k === 'sort') { UI.sort = e.target.value; renderRes(); }
    else if (k === 'gone') { UI.gone = e.target.checked; render(); }
    else if (k === 'ftipo') { const sel = $('#posSel'); if (sel && sel.dataset.new) { const s = suggestSlot(e.target.value); if (s) sel.value = keyOf(s); } }
  });
  document.addEventListener('submit', e => { if (e.target.id === 'lf') { e.preventDefault(); doLogin(); } });
  window.addEventListener('resize', () => { if (UI.tab === 'mappa' && UI.mapView === '3d') schedule3D(); }); window.addEventListener('online', () => renderHeader()); window.addEventListener('offline', () => renderHeader());
  $('#fileFoto').addEventListener('change', async e => { const f = e.target.files[0], b = fotoFor && getB(fotoFor); if (f && b) { try { await setPhotoFor(b, f); save(); toast('Foto salvata'); openBottle(b.id); render(); } catch (x) { toast('Foto non letta'); } } e.target.value = ''; });
  $('#fileImp').addEventListener('change', async e => { const f = e.target.files[0]; if (f) await doImport(f); e.target.value = ''; });
}

async function init() {
  bindEvents();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !window.__CLOUD__) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  try { Cloud = window.__CLOUD__ || await makeFirebase(); }
  catch (e) { showLogin(e.message || 'Errore di avvio', true); return; }
  Cloud.onAuth(u => { if (u) { curUser = u; hideLogin(); startCloud(); } else { curUser = null; stopCloud(); showLogin(); render(); } });
}
init();
</script>
</body>
</html>
